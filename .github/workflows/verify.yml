# G-12 · CI — the constitutional gate, on every push
#
# The pre-commit hook runs `npm run verify` locally, and --no-verify
# walks straight past it. This workflow is the gate that cannot be
# skipped: the same eighteen checks and the full suite, on every push
# and pull request, plus the production build the hook does not run.
#
# Branch protection on main requires this check, for admins too since
# 25 Sep 2026: a commit reaches main only once "verify" has passed on
# that exact commit. So it runs on a push to ANY branch as well. To ship:
# push your branch, wait for verify to pass on it, then fast-forward main
# to it (git push origin <branch>:main), or open a pull request. A direct
# push of an unverified commit to main is refused.

name: verify

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: The eighteen checks and the suite
        run: npm run verify

      - name: Production build from a clean checkout
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://getawaycollective.co
