/* The closed form, for screens that are not about choosing. */
.alloc-bar-row{border:1px solid var(--hair);background:var(--void-panel)}
.on-paper .alloc-bar-row{border-color:var(--hair-lt);background:var(--paper-panel)}
.alloc-bar-row .in{display:flex;gap:var(--s-s);align-items:baseline;flex-wrap:wrap;
  padding:var(--s-s) var(--s-m)}
.alloc-bar-row .in .btn{margin-left:auto;align-self:center}

/* == THE DISCLOSURE STRIP -- progressive disclosure, stated ========
   Four stages of the relationship, on every composed page: public,
   post-KYC, post-commitment, operational. Layout glue only -- the
   cells are the existing panel vocabulary. */
.disc-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;
  background:var(--hair);border:1px solid var(--hair)}
.on-paper .disc-strip{background:var(--hair-lt);border-color:var(--hair-lt)}
.disc-cell{background:var(--void-panel);padding:var(--s-s) var(--s-m)}
.on-paper .disc-cell{background:var(--paper-panel)}
.disc-cell p{margin-top:var(--s-2xs);color:var(--steel-dim)}
.on-paper .disc-cell p{color:var(--steel)}

/* Stage tags reuse the .conf chip; the dot names the stage. */
.conf.disc-public::before{background:var(--steel)}
.conf.disc-kyc::before{background:var(--electric)}
.conf.disc-committed::before{background:var(--copper)}
.conf.disc-operational::before{background:var(--confirm)}

/* == AS-35 NOTICES + AS-36 DIALOG FURNITURE ======================== */
/* The consent banner (P-03). Asserts, never blocks; decline is the
   primary action. Fixed to the foot, paper ground. */
.consent{position:fixed;inset:auto 0 0 0;z-index:70;border-top:2px solid var(--ink);
  background:var(--paper);color:var(--ink)}
.consent .in{max-width:1400px;margin:0 auto;padding:var(--s-s) var(--s-m);
  display:flex;gap:var(--s-l);align-items:center;justify-content:space-between;flex-wrap:wrap}
.consent .acts{display:flex;gap:var(--s-s);flex-wrap:wrap}
.consent a{color:inherit}

/* Notice cards. Urgency is a left band plus a text label - never
   colour alone. critical uses the rarest colour, twice in the
   catalogue, enforced at load. */
.notice{border:1px solid var(--hair);background:var(--void-panel);
  padding:var(--s-m);border-left-width:3px}
.notice.u-low{border-left-color:var(--steel)}
.notice.u-normal{border-left-color:var(--steel-dim)}
.notice.u-high{border-left-color:var(--hazard)}
.notice.u-critical{border-left-color:var(--critical)}
.n-head{display:flex;justify-content:space-between;gap:var(--s-s);align-items:baseline;
  flex-wrap:wrap;margin-bottom:var(--s-2xs)}
.n-tags{display:inline-flex;gap:var(--s-2xs);flex-wrap:wrap}
.conf.n-live::before{background:var(--confirm)}
.conf.n-spec::before{background:var(--electric)}
.conf.n-u-low::before{background:var(--steel)}
.conf.n-u-normal::before{background:var(--steel-dim)}
.conf.n-u-high::before{background:var(--hazard)}
.conf.n-u-critical::before{background:var(--critical)}
.n-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--s-s);
  border:1px solid var(--hair);padding:var(--s-s);margin-top:var(--s-s)}
.n-facts .k{display:block;margin-bottom:2px}
.n-foot{display:flex;justify-content:space-between;align-items:center;gap:var(--s-s);
  margin-top:var(--s-m);flex-wrap:wrap}
.n-links{display:inline-flex;gap:var(--s-2xs);flex-wrap:wrap}


/* == AS-37 THE SHELL -- transparent header + collapsible spine =====
   Adapted from gc_enterprise_knowledge_workspace.html.

   TWO CHANGES FROM THE FIRST CUT, BOTH DIRECTED:
   the collapse toggle moved from the header onto the spine it controls,
   and the header went transparent over the hero. The rail is therefore
   never fully hidden -- it collapses to a 60px icon spine at every
   width rather than sliding off-canvas -- which is what lets the
   hamburger go entirely. A control that hides the only way to bring
   itself back is not a control. */

.shell{display:grid;grid-template-columns:var(--rail,240px) minmax(0,1fr);
  grid-template-rows:56px 1fr;min-height:100vh}
.shell.is-collapsed{--rail:60px}

.skip{position:absolute;left:-9999px;top:0;z-index:900;background:var(--paper);
  color:var(--ink);padding:var(--s-2xs) var(--s-s);font:400 11px/1 var(--f-mono);
  letter-spacing:.14em;text-transform:uppercase}
.skip:focus{left:var(--s-s);top:var(--s-s)}

/* -- Top rail: transparent over the hero, opaque past it ---------- */
/* No background transition. Transitioning a background in a
   custom-property-themed system is how elements froze on the previous
   ground three times in this repo; the swap is a hard cut, and the
   SCRIM carries the softness instead. */
.rail-top{grid-column:1/3;grid-row:1;position:sticky;top:0;z-index:620;
  display:flex;align-items:center;gap:var(--s-s);padding:0 var(--s-m);
  background:transparent;border-bottom:1px solid transparent}
/* The scrim is structural, not decoration: type over an unscrimmed
   image is legible only against the part of the image it happens to
   land on. It sits behind the content and never intercepts a click. */
.rail-top::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(10,10,10,.82) 0%,rgba(10,10,10,.45) 55%,transparent 100%)}
.rail-top>*{position:relative;z-index:1}
.rail-top[data-solid="1"]{background:var(--void-panel);border-bottom-color:var(--hair)}
.rail-top[data-solid="1"]::before{display:none}
.on-paper .rail-top[data-solid="1"]{background:var(--paper-panel);border-bottom-color:var(--hair-lt)}

/* Over a scrimmed hero the header is always light-on-dark, whatever
   ground the page below uses. Only the solid state follows the ground. */
.shell .brand{font:300 20px/1 var(--f-display);letter-spacing:-.02em;
  text-transform:uppercase;color:var(--ink-inv);text-decoration:none;flex:none}
.shell .brand .dot{color:var(--steel-dim)}
.rail-top[data-solid="1"].on-paper .brand,
.on-paper .rail-top[data-solid="1"] .brand{color:var(--ink)}

.crumbs{display:flex;align-items:baseline;gap:var(--s-2xs);min-width:0;
  font:400 10px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--steel-dim)}
.crumbs .now{color:var(--ink-inv);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs .sep{opacity:.5}
.rail-spacer{flex:1 1 auto}
.vantage{color:var(--steel-dim);white-space:nowrap}
.on-paper .rail-top[data-solid="1"] .crumbs{color:var(--steel)}
.on-paper .rail-top[data-solid="1"] .crumbs .now{color:var(--ink)}
.on-paper .rail-top[data-solid="1"] .vantage{color:var(--steel)}
@media (max-width:700px){ .crumbs .v,.crumbs .sep,.vantage{display:none} }

/* -- Left rail: a spine, never hidden ----------------------------- */
/* THE RAIL IS CHROME, NOT A SLAB.
   It was an opaque 240px panel butted against the page, which made it
   read as bolted on -- the hero stopped dead at its edge. It now floats
   over the hero exactly as the header does, transparent while the hero
   is in view and opaque the moment content scrolls beneath it, driven
   by the SAME `solid` signal so the two never disagree. Below the hero
   the page ground is --void and the rail panel is --void-panel, so the
   transparent state is very nearly the panel anyway; what changes is
   that the image now runs behind it. */
.rail-left{grid-column:1;grid-row:2;position:sticky;top:56px;align-self:start;
  height:calc(100vh - 56px);display:flex;flex-direction:column;
  justify-content:space-between;overflow:hidden;z-index:630;
  background:transparent;border-right:1px solid transparent}
.rail-left[data-solid="1"]{background:var(--void-panel);border-right-color:var(--hair)}
.on-paper .rail-left[data-solid="1"]{background:var(--paper-panel);border-right-color:var(--hair-lt)}

/* The collapse control: a small chevron at the quiet end of the rail,
   above the foot links. No box, no label -- it changes the furniture,
   it is not a destination. */
.rail-collapse{display:flex;align-items:center;justify-content:flex-end;width:100%;
  padding:6px var(--s-m);background:none;border:none;
  color:var(--steel-dim);cursor:pointer;
  transition:color var(--d-instant)}
.on-paper .rail-collapse{color:var(--steel)}
.rail-collapse svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;
  stroke-width:1.6;stroke-linecap:square;stroke-linejoin:miter}
.rail-collapse:hover{color:var(--ink-inv)}
.on-paper .rail-collapse:hover{color:var(--ink)}
.is-collapsed .rail-collapse{justify-content:center;padding:8px 0}

.rail-scroll{overflow-y:auto;padding:var(--s-s) 0;flex:1 1 auto}
.rail-group{display:flex;flex-direction:column;padding-bottom:var(--s-s)}
/* steel-dim on void, steel on paper. 11px is TEXT, and steel is 3.72:1
   on void -- the same trap .label records above. */
.rail-head{display:block;color:var(--steel-dim);padding:var(--s-2xs) var(--s-m) var(--s-3xs)}
.on-paper .rail-head{color:var(--steel)}
.is-collapsed .rail-head{visibility:hidden;height:14px;padding:0}

.rail-item{display:flex;align-items:center;gap:var(--s-s);
  padding:10px var(--s-m);border-left:2px solid transparent;
  color:var(--steel-dim);text-decoration:none;
  font:400 11px/1.3 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;
  transition:color var(--d-instant),background var(--d-instant)}
.on-paper .rail-item{color:var(--steel)}
.rail-item svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;
  stroke-width:1.4;stroke-linecap:square;stroke-linejoin:miter}
.rail-item .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-item:hover{color:var(--ink-inv);background:rgba(242,242,242,.05)}
.on-paper .rail-item:hover{color:var(--ink);background:rgba(10,10,10,.04)}

/* Active is PAPER, never copper: copper is money and nothing else. */
.rail-item[aria-current="page"]{color:var(--ink-inv);border-left-color:var(--ink-inv);
  background:rgba(242,242,242,.08);font-weight:700}
.on-paper .rail-item[aria-current="page"]{color:var(--ink);border-left-color:var(--ink);
  background:rgba(10,10,10,.06)}

.is-collapsed .rail-item{justify-content:center;padding:12px 0;gap:0}
.is-collapsed .rail-item .lbl{display:none}

.rail-foot{border-top:1px solid var(--hair);padding:var(--s-2xs) 0;flex:none}
.on-paper .rail-foot{border-top-color:var(--hair-lt)}

.rail-who{display:flex;align-items:center;gap:var(--s-s);padding:var(--s-s) var(--s-m)}
.is-collapsed .rail-who{justify-content:center;padding:var(--s-s) 0}
/* A square. The Zero Radius Doctrine has no avatar exception. */
.rail-who .sq{width:30px;height:30px;flex:none;display:flex;align-items:center;
  justify-content:center;border:1px solid var(--hair);color:var(--steel-dim);
  font:400 11px/1 var(--f-mono)}
.on-paper .rail-who .sq{border-color:var(--hair-lt);color:var(--steel)}
.rail-who .who-meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.rail-who .nm{font:400 13px/1.2 var(--f-body);color:var(--ink-inv);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.on-paper .rail-who .nm{color:var(--ink)}
.rail-who .rl{color:var(--steel-dim)}
.on-paper .rail-who .rl{color:var(--steel)}
.is-collapsed .rail-who .who-meta{display:none}

/* THE PANE IS FULL BLEED; ITS PADDING CLEARS THE RAIL.
   Previously the pane began at the rail's right edge, so .wrap centred
   in what was left and the hero bed stopped at a hard vertical seam.
   Now the pane spans both columns -- the bed runs edge to edge behind
   the rail -- and padding-left keeps every line of text clear of it.
   The hero cancels that padding for its BED only, which is why it
   carries a negative margin and the same padding back. */
/* THE CONTENT IS ANCHORED TO THE RAIL, NOT CENTRED AWAY FROM IT.
   .wrap centres its 1400px inside whatever space is left, which on a
   wide screen opened a gutter beside the rail that belonged to nothing
   -- the complaint that started this. The pane now carries the rail
   width plus ONE gutter, and the wrap inside is left-anchored, so the
   distance from the spine to the first character is the same at every
   width and all remaining slack falls on the right where the eye does
   not read it as a hole. */
.rail-main{grid-column:1/3;grid-row:1/3;min-width:0;
  padding-left:calc(var(--rail,240px) + var(--s-l))}
.rail-main .wrap,.rail-main .narrow{margin-left:0;margin-right:auto;padding-left:0}
.p-hero{margin-left:calc((var(--rail,240px) + var(--s-l)) * -1);
  padding-left:calc(var(--rail,240px) + var(--s-l))}

/* -- Small screens: the spine narrows, it never disappears -------- */
@media (max-width:900px){
  .shell{--rail:60px}
  .rail-main{padding-left:calc(60px + var(--s-m))}
  .p-hero{margin-left:calc((60px + var(--s-m)) * -1);padding-left:calc(60px + var(--s-m))}
  .rail-main:has(>section[data-sec] h1) >section[data-sec]:first-of-type{
    margin-left:calc((60px + var(--s-m)) * -1);padding-left:calc(60px + var(--s-m))}
  .shell.is-collapsed{--rail:60px}
  .rail-item,.rail-collapse{justify-content:center;padding:12px 0;gap:0}
  .rail-item .lbl,.rail-collapse .lbl{display:none}
  .rail-head{visibility:hidden;height:14px;padding:0}
  .rail-who{justify-content:center;padding:var(--s-s) 0}
  .rail-who .who-meta{display:none}
}

/* -- THE HERO ------------------------------------------------------
   Every page opens with one. No photography exists, so the bed is a
   generated plate derived from the forest token and the surface's own
   hue -- honest about being generated, and it carries the same scrim
   discipline a photograph would need. FB-1 still holds: no FIGURE is
   set over the bed, only a title, an eyebrow and a line of prose. */
.p-hero{position:relative;min-height:clamp(240px,38vh,380px);display:flex;
  align-items:flex-end;overflow:hidden;margin-bottom:var(--s-xl)}
.p-hero .bed{position:absolute;inset:0}
.p-hero .sc{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(10,10,10,.94) 0%,rgba(10,10,10,.55) 45%,rgba(10,10,10,.35) 100%)}
.p-hero .in{position:relative;width:100%;padding:var(--s-2xl) var(--s-m) var(--s-l) 0}
.p-hero .eyebrow{color:var(--mist);display:block;margin-bottom:var(--s-2xs)}
.p-hero h1{max-width:20ch;color:var(--paper)}
.p-hero .sup{margin-top:var(--s-s);max-width:60ch;color:var(--mist)}

/* "EVERY PAGE HAS A HERO" -- AND NEVER TWO TITLES.
   The shell renders .p-hero-shell for every surface. Three kinds of
   page already open with their own title, and each suppresses it:
     .p-hero-own  the composer's hero
     .hero        the atom, on the hand-built gateway screens
     a leading <section> carrying an <h1>
   The third case is what shipped broken: the shell titled the page and
   the page titled itself, so "The Collection" appeared twice, one above
   the other. Caught by looking at the rendered page, not by counting
   components. */
.rail-main:has(.p-hero-own) .p-hero-shell,
.rail-main:has(.hero) .p-hero-shell,
.rail-main:has(>section[data-sec] h1) .p-hero-shell{display:none}

/* A page that supplies its own opening section still owes a hero image.
   Rather than edit twenty components, the FIRST such section is bedded
   here, using the hue the shell publishes on .rail-main. Full bleed
   behind the rail like every other hero; the wrap inside keeps the text
   clear of it. */
.rail-main:has(>section[data-sec] h1) >section[data-sec]:first-of-type{
  position:relative;margin-left:calc(var(--rail,240px) * -1);
  padding-left:var(--rail,240px);padding-top:var(--s-3xl);
  border-bottom:none}
.rail-main:has(>section[data-sec] h1) >section[data-sec]:first-of-type::before{
  content:"";position:absolute;inset:0;z-index:0;
  background:linear-gradient(145deg,
    hsl(var(--page-hue,198) 34% 26%) 0%,
    hsl(var(--page-hue,198) 30% 13%) 55%,
    var(--void) 100%)}
/* A HEAVIER SCRIM THAN THE COMPOSED HERO NEEDS, on purpose.
   That hero sets its own type in --mist and --paper; a hand-built
   opening section uses .sec-ref and .dim, which are steel-dim. Measured
   against the LIGHTEST end of the plate the lighter scrim gave 4.49:1
   -- under AA by one hundredth, which is still under. The scrim carries
   the fix rather than the copy, so no page has to change its words to
   sit on an image. */
.rail-main:has(>section[data-sec] h1) >section[data-sec]:first-of-type::after{
  content:"";position:absolute;inset:0;z-index:0;
  background:linear-gradient(to top,rgba(10,10,10,.96) 0%,rgba(10,10,10,.78) 45%,rgba(10,10,10,.62) 100%)}
.rail-main:has(>section[data-sec] h1) >section[data-sec]:first-of-type>*{
  position:relative;z-index:1}

[hidden]{display:none !important}
</style>
</head>
<body>

<div id="ring" aria-hidden="true"></div>
<div id="shutter" aria-hidden="true"></div>
<div id="ticker" class="t-mono-s info" role="status" aria-live="polite">
  <span class="k">SYSTEM</span><span class="v" id="tickerMsg"></span>
</div>

<header class="hud">
  <div class="hud-in">
    <span class="brand t-micro">GC.SYSTEM</span>
    <span class="t-micro label" id="hudVantage">gateway vantage</span>
    <nav aria-label="Assemblies">
      <button data-go="AS-01" aria-current="page">AS-01 Gateway</button>
      <button data-go="AS-02">AS-02 Console</button>
      <button data-go="AS-03">AS-03 Property</button>
      <button data-go="AS-04">AS-04 Capital</button>
      <button data-go="AS-05">AS-05 Member</button>
      <button data-go="AS-06">AS-06 Commit</button>
      <button data-go="AS-09">AS-09 Frame</button>
      <button data-go="AS-10">AS-10 Strip</button>
      <button data-go="AS-11">AS-11 Stages</button>
      <button data-go="AS-12">AS-12 Location</button>
      <button data-go="AS-13">AS-13 Docket</button>
      <button data-go="AS-25">AS-25 Time</button>
      <button data-go="AS-24">AS-24 Voices</button>
      <button data-go="AS-14">AS-14 Risk</button>
      <button data-go="AS-26">AS-26 Call</button>
      <button data-go="AS-27">AS-27 Ballot</button>
      <button data-go="AS-19">AS-19 Lock</button>
      <button data-go="AS-28">AS-28 Risk Reg</button>
      <button data-go="AS-17">AS-17 Answers</button>
      <button data-go="AS-15">AS-15 Status</button>
      <button data-go="AS-16">AS-16 404</button>
      <button data-go="AS-07">AS-07 Brands</button>
      <button data-go="AS-18">AS-18 Roles</button>
      <button data-go="AS-08">AS-08 Story</button>
    </nav>
  </div>
</header>

<main id="stage"></main>

<script>
/* ═══════════════════════════════════════════════════════════════════
   ONE BUSINESS OBJECT. SIX VANTAGES.

   This is the whole claim of the aperture system, and it is executed
   literally: there is exactly one KYOTO record below, and every screen
   reads from it. No screen holds its own copy of a valuation, so two
   screens cannot drift into disagreeing — which is precisely how the
   source prototypes ended up with four different valuations for the
   same house.

   An aperture may show LESS. It may never show DIFFERENT.
   ═══════════════════════════════════════════════════════════════════ */

const PROPERTIES = [
  {
    ufr0060:"Kyoto House", assetId:"KYO-01",
    ufr0063:"Kyoto, Japan",                       // jurisdiction
    ufr0102:124000000_0000n,                      // valuation, minor units ×10^4
    ufr0103:"Independent appraisal · Nomura Real Estate",
    ufr0101:"2026-06-30",                         // valued on
    ufr0061:"Coastal Collection SPV I",           // vehicle
    ufr0065:"110 m²", ufr0066:"Stabilised", ufr0067:"2025-11-14",
    ufr0068:"Machiya restoration · timber reuse 78%",
    yield:{ v:8.4, conf:"modelled" },             // forward-looking. Carries its class.
    availability:"Q3 2026",
    telemetry:{ state:"live", at:"2026-07-31 09:12" },
    units:12, held:1,
  },
  {
    ufr0060:"Swiss Vault", assetId:"CHE-02",
    ufr0063:"Valais, Switzerland",
    ufr0102:186500000_0000n,
    ufr0103:"Independent appraisal · Wüest Partner",
    ufr0101:"2026-05-31",
    ufr0061:"Alpine Collection SPV II",
    ufr0065:"96 m²", ufr0066:"Stabilised", ufr0067:"2024-09-02",
    ufr0068:"Passive house · certified",
    yield:{ v:12.1, conf:"modelled" },
    availability:"Allocated",
    telemetry:{ state:"stale", at:"2026-07-24 04:40" },
    units:12, held:0,
  },
  {
    ufr0060:"Oslo Base", assetId:"NOR-03",
    ufr0063:"Vestland, Norway",
    ufr0102:98200000_0000n,
    ufr0103:"Management estimate",                 // weaker source — and it SAYS so
    ufr0101:"2026-07-15",
    ufr0061:"Nordic Collection SPV I",
    ufr0065:"140 m²", ufr0066:"Lease-up", ufr0067:null,
    ufr0068:"Mass timber · district heat",
    yield:{ v:9.7, conf:"estimated" },
    availability:"Q1 2027",
    telemetry:{ state:"live", at:"2026-07-31 09:08" },
    units:12, held:0,
  },
];

/* ── Money: exact decimal, never a float ─────────────────────────── */
const SCALE = 4n, FACTOR = 10n ** SCALE;
function inr(minor, opts = {}){
  const neg = minor < 0n; let n = neg ? -minor : minor;
  let whole = n / FACTOR, frac = n % FACTOR;
  let s = whole.toString();
  // Indian digit grouping: last three, then pairs.
  if (s.length > 3){
    const last3 = s.slice(-3); let rest = s.slice(0, -3), out = [];
    while (rest.length > 2){ out.unshift(rest.slice(-2)); rest = rest.slice(0, -2); }
    if (rest) out.unshift(rest);
    s = out.join(",") + "," + last3;
  }
  let str = "₹" + s;
  if (opts.paise){ str += "." + frac.toString().padStart(4,"0").slice(0,2); }
  return (neg ? "−" : "") + str;
}
const rate = (minor, bps) => (minor * BigInt(bps)) / 10000n;

/* Largest-remainder allocation, so a split sums EXACTLY to the total.
   The prototype stated a fraction price separately; twelve of its figure
   came four rupees short of its own valuation. */
function allocate(total, weights){
  const sum = weights.reduce((a,b)=>a+b, 0n);
  if (sum === 0n) return weights.map(()=>0n);
  const base = weights.map(w => (total * w) / sum);
  let rem = total - base.reduce((a,b)=>a+b, 0n);
  const order = weights
    .map((w,i)=>({ i, r:(total*w) % sum }))
    .sort((a,b)=> a.r < b.r ? 1 : a.r > b.r ? -1 : 0);
  for (let k = 0; rem > 0n; k++, rem--) base[order[k % order.length].i] += 1n;
  return base;
}
const fractionPrice = (p) => allocate(p.ufr0102, Array(p.units).fill(1n))[0];

/* ── Provenance ──────────────────────────────────────────────────── */
const CONF = {
  observed:"Observed", verified:"Verified", modelled:"Modelled",
  estimated:"Estimated", forecast:"Forecast", pending:"Pending",
};
const PROVISIONAL = new Set(["modelled","estimated","forecast","pending"]);
const tag = (c) => `<span class="conf ${c}">${CONF[c]}</span>`;
/* A provisional figure carries the mark. Trust it the same amount. */
const pctOf = (y) => `<span class="pct">${PROVISIONAL.has(y.conf)?'<span class="prov">~</span>':''}${y.v.toFixed(1)}%</span>`;

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ── Signal aperture ─────────────────────────────────────────────── */
let tickT;
function signal(msg, kind="info"){
  const el = document.getElementById("ticker");
  document.getElementById("tickerMsg").textContent = msg;
  el.className = "t-mono-s on " + kind;
  clearTimeout(tickT);
  /* Auto-dismisses because nothing was asked of anyone. A member-facing
     toast (NT-01) does not; it reports what the MEMBER did. */
  tickT = setTimeout(()=> el.classList.remove("on"), 4200);
}

/* ── Value transitions ───────────────────────────────────────────── */
/* SCRAMBLE IS BARRED ON MONEY. For ~400ms a scramble renders digits that
   were never the value, in the currency tone, at the currency's size,
   indistinguishable from digits that are. Money COUNTS: every frame is a
   real number between two real numbers. */
function countTo(el, fromMinor, toMinor, ms=700){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches){
    el.textContent = inr(toMinor); return;
  }
  const t0 = performance.now(), d = toMinor - fromMinor;
  (function step(t){
    const k = Math.min(1, (t - t0)/ms);
    const eased = 1 - Math.pow(1-k, 3);
    el.textContent = inr(fromMinor + (d * BigInt(Math.round(eased*10000))) / 10000n);
    if (k < 1) requestAnimationFrame(step);
    else { el.textContent = inr(toMinor); flash(el); }
  })(t0);
}
/* Scramble stays permitted on an IDENTIFIER, which has no magnitude to
   misread. The rule was never about the animation. */
function scramble(el, final){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent = final; return; }
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-";
  let i = 0;
  const iv = setInterval(()=>{
    el.textContent = final.split("").map((c,n)=> n < i ? final[n] : chars[Math.floor(Math.random()*chars.length)]).join("");
    if (i >= final.length){ clearInterval(iv); el.textContent = final; }
    i += 1/2;
  }, 30);
}
function flash(el){ el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }

/* ═══════════════════════════════════════════════════════════════════
   THE APERTURES
   ═══════════════════════════════════════════════════════════════════ */

/* AP-01 · gateway · narrow.
   Withholds valuation, source, vehicle, lifecycle, reserve — not because
   they are secret, but because a figure shown without its provenance
   invites a decision it cannot support. */
function AP01(p, i){
  return `
  <button class="ap-gateway" data-ap data-idx="${i}" data-open="0"
          aria-expanded="false" aria-label="${esc(p.ufr0060)}, ${esc(p.ufr0063)}. Show indicative figures.">
    <span class="plate" aria-hidden="true"></span>
    <span class="scrim" aria-hidden="true"></span>
    <span class="body">
      <span class="t-micro label" style="display:block;margin-bottom:var(--s-2xs)">${esc(p.ufr0063)}</span>
      <h3>${esc(p.ufr0060.replace(" ","<br>"))}</h3>
      <span class="deferred">
        <span class="t-mono-s" style="color:var(--copper)">YIELD ${pctOf(p.yield)}</span>
        ${tag(p.yield.conf)}
        <span class="rule-x" aria-hidden="true"></span>
        <span class="t-mono-s">${esc(p.availability)}</span>
      </span>
    </span>
  </button>`;
}

/* AP-02 · capital · wide. Withholds nothing, and the linter enforces
   that literally: it may not omit a field any narrower vantage shows. */
function AP02(p){
  const live = p.telemetry.state === "live";
  return `
  <article class="ap-console on-panel">
    <div class="top">
      <span class="t-mono-s label">${esc(p.assetId)}</span>
      <span class="led ${live?"live":"stale"} t-mono-s">
        <i aria-hidden="true"></i>${live?"Live":"Stale"}
      </span>
    </div>

    <div class="field">
      <span class="k t-micro">Valuation</span>
      <span class="v"><span class="figure money" data-val="${p.ufr0102}">${inr(p.ufr0102)}</span></span>
      <!-- Source directly beneath the figure. Never a tooltip. -->
      <span class="source t-mono-s">${esc(p.ufr0103)} · ${esc(p.ufr0101)}</span>

/* SIX STAGES. The source had four and no debt service — a waterfall that
   omits the senior claim shows a distributable figure that is not
   distributable. */
const GROSS = 4000000_0000n;
const WATERFALL = [
  { k:"Gross revenue",       bps:10000, cls:"",       note:"Operating revenue for the period, before any claim." },
  { k:"1 · Operating Partner", bps:3500, cls:"less",   note:"Contracted operator. Measured on SLA." },
  { k:"2 · Brand",             bps:1000, cls:"less",   note:"Brand & Digital Co. licence." },
  { k:"3 · Admin Reserve",     bps:250,  cls:"less",
    note:"2.5% OF REVENUE — not a fee on asset value. A fee on asset value rewards holding assets at a high mark." },
  { k:"4 · Sinking Fund",      bps:250,  cls:"less",   note:"CapEx reserve. Funds replacement before failure." },
  { k:"5 · Debt Service",      bps:1200, cls:"senior",
    note:"THE SENIOR CLAIM. Absent entirely from the source prototype." },
  { k:"6 · To Partners",       bps:3800, cls:"out",
    note:"No preferred return, no catch-up, no carry. Blocked if the reserve would fall below its floor." },
];

/* The six claims must account for ALL of gross revenue. A waterfall that
   sums to anything but 100% has revenue going somewhere it does not name,
   which is the same defect as omitting a stage — it is just harder to see.
   Checked at render, not assumed. */
(function closes(){
  const bps = WATERFALL.slice(1).reduce((n,s)=> n + s.bps, 0);
  const rupees = WATERFALL.slice(1).reduce((n,s)=> n + rate(GROSS, s.bps), 0n);
  if (bps !== 10000 || rupees !== GROSS){
    throw new Error(`Waterfall does not close: ${bps}bps, ${rupees} of ${GROSS}`);
  }
})();

   partners, capital contribution, an LLP Agreement, and a profit share

function calendar(fyEndISO){

      due: addDays(fyEndISO, 60),   basis:"Within 60 days of financial year end" },
    { f:"Form 8",  w:"Statement of Account & Solvency",

  "FY2024-25|Form 11": "2025-05-14",
  "FY2024-25|Form 8":  "2025-10-27",
  "FY2024-25|ITR-5":   "2025-10-30",
};

function calendarRows(){
  const out = [];
  for (const fy of ["FY2025-26", "FY2024-25"]) {
    const end = fy === "FY2025-26" ? "2026-03-31" : "2025-03-31";
    for (const c of calendar(end)) {
      if (!c.due) continue;
      const filedOn = FILED[`${fy}|${c.f}`] ?? null;
      const late = filedOn ? days(c.due, filedOn) > 0 : days(c.due, TODAY) > 0;
      const state = filedOn ? (late ? "filed-late" : "filed") : (late ? "overdue" : "open");
      out.push({ fy, ...c, filedOn, state, daysOut: days(TODAY, c.due) });

function hero({ eyebrow, claim, sup, go = [], hue = 158 }){

    <span class="scrim" aria-hidden="true"></span>

      ).join("")}</div>` : ""}
    </div>
  </div>`;
  /* No figure appears here. FB-1 bars full-bleed treatment wherever

}

   Severity is COMPUTED from likelihood × impact. A typed severity is a

    rev:"2026-07-15", next:"2026-10-15" },
  { c:"Climate",       t:"Monsoon intensity above design tolerance at Coorg", l:3, i:4,
    o:"Civil Lead", m:"Drainage designed to 1-in-100; sinking fund covers remediation",
    rev:"2026-02-11", next:"2026-05-11" },
  { c:"Regulatory",    t:"Coastal Regulation Zone amendment affects land use", l:2, i:4,
    o:"Statutory Approvals", m:"Monitoring bill progress; no coastal asset held at present",
    rev:"2026-07-02", next:"2027-01-02" },
  { c:"Interest Rate", t:"Floating facility repricing above debt service cover", l:3, i:3,
    o:"PMC", m:"DSCR covenant monitored monthly; 12% of revenue at stage 5",
    rev:"2026-07-20", next:"2026-10-20" },

    o:"Statutory Approvals", m:"Title insurance in force; due diligence pack in the docket",
    rev:"2026-05-18", next:"2027-05-18" },
];

/* Computed, never typed. */
const severity = (l, i) => l * i;
const band = (n) => n >= 15 ? { k:4, t:"Critical" } : n >= 9 ? { k:3, t:"High" }
                  : n >= 4 ? { k:2, t:"Moderate" } : { k:1, t:"Low" };

/* A register nobody has reviewed renders its staleness. An unreviewed
   risk register is more dangerous than none, because it looks like
   oversight. */
const overdue = (next) => Date.parse(next) < Date.parse(TODAY);

  return `

        </tr></thead>

        keyboard, and refused the standard artefact — which filters hardest against people without
        time to make a bespoke one.</span>
      <span class="fix"><b>Fixed</b> The filled role stays at full contrast. The source held it at
        <code>opacity: 0.3</code> with pointer-events off — near 2:1, so someone deciding whether to
        watch for the next opening could not read what it was.</span>
      <span class="fix"><b>Fixed</b> Seniority stated plainly instead of <code>L1 / L2 / L3
        CLEARANCE</code>. Invented security theatre on a hiring page reads as confusing or
        untrue.</span>
      <span class="fix"><b>Fixed</b> <code>guest loop</code> → occupancy sequence. §25.</span>
    </div>
  </div>
</section>
${footer()}` };

/* ═══════════════════════════════════════════════════════════════════
   AS-08 · THE STORY PLAYBACK

   Gateway only, and NO FIGURE appears in the player at any point. A
   number on a card that advances in four seconds cannot be read, checked
   or returned to.

   The source auto-advanced every 4000ms with pause available only by
   holding a touch — WCAG 2.2.2, and a keyboard had no pause, no advance
   and no exit.
   ═══════════════════════════════════════════════════════════════════ */

const STORY = [
  { t:"Algorithmic burnout", s:"The premise",
    x:"The old world optimised for output. This one optimises for what is left of you afterwards.", hue:210 },
  { t:"Ninety minutes out", s:"Drift",
    x:"Far enough that the phone stops mattering. Close enough that you go on a Thursday.", hue:186 },
  { t:"The long exhale", s:"SlowSpace",
    x:"Two to five nights. Long enough that the second day feels different from the first.", hue:158 },
  { t:"Arranged, not staged", s:"Eskape",
    x:"Every hour is planned and none of it announces itself.", hue:24 },
  { t:"Held, not rented", s:"The protocol",
    x:"You own a share of the land underneath all of it.", hue:172 },
];

A["AS-08"] = { vantage:"gateway", render: () => `
${hero({ eyebrow:"AS-08 · Story", claim:"Five frames.",
  sup:"A sequence about the places. It advances when you advance it.", hue:210 })}

<section data-sec="AS-08.a" style="border-bottom:none">
  <div class="wrap">
    <div class="sec-head"><span class="sec-ref">AS-08.a</span>
      <span class="t-micro label">Grid · ${STORY.length} frames</span></div>
    <div class="tiles">
      ${STORY.map((v,i)=>`
        <button class="tile" data-story="${i}" aria-label="Open frame ${i+1}: ${esc(v.t)}">
          <span class="bed" style="${plate(v.hue)}" aria-hidden="true"></span>
          <span class="sc" aria-hidden="true"></span>
          <span class="cap">
            <span class="t-micro label" style="display:block;margin-bottom:5px">
              ${String(i+1).padStart(2,"0")} · ${esc(v.s)}</span>
            <h3>${esc(v.t)}</h3>
          </span>
        </button>`).join("")}
    </div>

    <div class="fixes">
      <span class="fix"><b>Fixed</b> A visible pause control, Escape to exit, and arrow keys to
        advance. The source auto-advanced every 4s with pause available only by holding a touch —
        WCAG 2.2.2, and a keyboard had no pause, no advance and no exit at all.</span>
      <span class="fix"><b>Fixed</b> Auto-advance is off entirely under
        <code>prefers-reduced-motion</code>, and the position is stated as text throughout.</span>
      <span class="fix"><b>Rule</b> No figure appears in the player. A number on a card that
        advances in four seconds cannot be read, checked, or returned to.</span>
      <span class="fix"><b>Note</b> This assembly may not earn its place. AS-09 Gallery Frame covers
        most of the same ground with far fewer constraints, and two cinematic formats at one vantage
        may be one too many. It is built so the comparison can be made rather than argued.</span>
    </div>
  </div>
</section>

<div id="player" role="dialog" aria-modal="true" aria-label="Story player">
  <div class="pl-bars" id="plBars">
    ${STORY.map((_,i)=>`<i><b data-plbar="${i}"></b></i>`).join("")}
  </div>
  <div class="pl-top">
    <span class="t-mono-s dim" id="plPos" role="status" aria-live="polite"></span>
    <span class="pl-ctl">
      <button class="btn" id="plPrev" aria-label="Previous frame">&larr;</button>
      <button class="btn" id="plPause" aria-pressed="false">Pause</button>
      <button class="btn" id="plNext" aria-label="Next frame">&rarr;</button>
      <button class="btn" id="plExit">Close</button>
    </span>
  </div>
  <div class="pl-stage">
    ${STORY.map((v,i)=>`
      <div class="pl-card" data-plcard="${i}">
        <span class="bed" style="${plate(v.hue)}" aria-hidden="true"></span>
        <span class="sc" aria-hidden="true"></span>
        <div class="cap">
          <span class="t-micro label" style="display:block;margin-bottom:var(--s-2xs)">
            ${String(i+1).padStart(2,"0")} · ${esc(v.s)}</span>
          <h2>${esc(v.t)}</h2>
          <p class="t-body-l dim">${esc(v.x)}</p>
        </div>
      </div>`).join("")}
  </div>
</div>
${footer()}` };

/* ═══════════════════════════════════════════════════════════════════
   NAVIGATION
   ═══════════════════════════════════════════════════════════════════ */
const stage = document.getElementById("stage");
let current = null;

function mount(id){
  const a = A[id]; if (!a) return;
  current = id;
  stage.innerHTML = a.render();
  document.getElementById("hudVantage").textContent = a.vantage + " vantage";
  document.querySelectorAll(".hud nav button").forEach(b =>
    b.hasAttribute("aria-current") && b.dataset.go !== id ? b.removeAttribute("aria-current")
      : b.dataset.go === id && b.setAttribute("aria-current","page"));
  window.scrollTo(0,0);
  wire();
}

function go(id){
  if (id === current) return;
  const sh = document.getElementById("shutter");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce){ mount(id); signal("Vantage " + A[id].vantage); return; }
  sh.className = "on";
  setTimeout(()=>{
    mount(id);
    signal("Vantage " + A[id].vantage);
    sh.className = "off";
    setTimeout(()=> sh.className = "", 600);
  }, 600);
}

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g){ go(g.dataset.go); return; }
});

/* ── Per-assembly wiring ─────────────────────────────────────────── */
function wire(){
  /* AP-01 — tap toggles the deferred row. Hover and focus already do. */
  stage.querySelectorAll("[data-ap]").forEach(el => {
    el.addEventListener("click", () => {
      const open = el.dataset.open === "1" ? "0" : "1";
      el.dataset.open = open;
      el.setAttribute("aria-expanded", open === "1");
    });
  });

  /* AP-02 — sync telemetry. Money COUNTS. Identifier scrambles. */
  stage.querySelectorAll("[data-sync]").forEach(btn => {
    btn.addEventListener("click", () => {
      const card = btn.closest(".ap-console");
      const fig = card.querySelector(".figure.money");
      const id  = card.querySelector(".top .t-mono-s");
      const from = BigInt(fig.dataset.val);
      const to = from + (from * 37n) / 10000n;   // +0.37%
      signal("Fetching telemetry…");
      btn.disabled = true;
      setTimeout(()=>{
        scramble(id, btn.dataset.sync);
        countTo(fig, from, to);
        fig.dataset.val = to;
        setTimeout(()=>{ signal("Telemetry synced", "ok"); btn.disabled = false; }, 800);
      }, 500);
    });
  });

  /* AS-03 — Trinity Lens. Arrow keys move between lenses. */
  const tabs = [...stage.querySelectorAll('[role="tab"]')];
  const select = (t) => {
    tabs.forEach(x => {
      const on = x === t;
      x.setAttribute("aria-selected", on);
      x.tabIndex = on ? 0 : -1;
      document.getElementById(x.getAttribute("aria-controls")).hidden = !on;
    });
  };
  tabs.forEach((t,i) => {
    t.addEventListener("click", () => select(t));
    t.addEventListener("keydown", e => {
      const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
      if (!d) return;
      e.preventDefault();
      const n = tabs[(i + d + tabs.length) % tabs.length];
      select(n); n.focus();
    });
  });

  /* AS-04 — waterfall bars fill from zero, unless reduced motion. */
  const bars = stage.querySelectorAll(".wf-bar");
  if (bars.length){
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const fill = () => bars.forEach((b,i) => {
      const w = b.dataset.w + "%";
      if (reduce){ b.style.width = w; return; }
      setTimeout(()=> b.style.width = w, i * 90);
    });
    new IntersectionObserver((es, o) => es.forEach(en => {
      if (en.isIntersecting){ fill(); o.disconnect(); }
    }), { threshold:.25 }).observe(document.getElementById("wf"));
  }

  /* AS-06 — steps, autosave, piston. */
  stage.querySelectorAll("[data-step]").forEach(b => {
    b.addEventListener("click", () => {
      const next = +b.dataset.step, cur = next - 1;
      const c = document.getElementById("st"+cur);
      if (cur === 1){
        const nm = (document.getElementById("nm").value || "—").trim();
        const em = (document.getElementById("em").value || "—").trim();
        document.getElementById("sum1").textContent = nm + " · " + em;
      }
      if (cur === 2){
        document.getElementById("sum2").textContent =
          "PAN " + ((document.getElementById("pan").value || "—").trim().toUpperCase());
      }
      if (cur === 3) document.getElementById("sum3").textContent = "Reviewed";
      c.dataset.state = "done";
      document.getElementById("st"+next).dataset.state = "active";
      document.getElementById("st"+next).scrollIntoView({behavior:"smooth", block:"center"});
    });
  });

  /* Autosave per field on blur — what makes PR-01 genuinely resumable. */
  stage.querySelectorAll(".f input").forEach(inp => {
    inp.addEventListener("blur", () => {
      if (!inp.value.trim()) return;
      const sv = inp.closest(".step").querySelector(".saved");
      if (!sv) return;
      sv.classList.add("on");
      setTimeout(()=> sv.classList.remove("on"), 1800);
    });
  });

  /* THE PISTON. Linear, 3000ms, never eased — an eased fill would
     misreport how much time is left to let go.

     Wired by CLASS, not by id: AS-06, AS-19 and AS-26 each have one, and
     each declares what happens when it fires via data-fires. */
  stage.querySelectorAll(".piston").forEach((piston) => {
    let timer = null, done = false;
    const cap = piston.querySelector(".cap");
    const fires = piston.dataset.fires || "commit";
    const start = (e) => {
      if (done) return;
      if (e.type === "keydown" && e.key !== " " && e.key !== "Enter") return;
      if (e.type === "keydown" && e.repeat) return;
      e.preventDefault();
      piston.classList.remove("rel"); piston.classList.add("arm");
      cap.textContent = "Hold…";
      timer = setTimeout(fire, 3000);
    };
    const stop = () => {
      if (done || timer === null) return;
      clearTimeout(timer); timer = null;
      piston.classList.remove("arm"); piston.classList.add("rel");
      cap.textContent = "Cancelled — hold to commit";
    };
    const fire = () => {
      done = true; timer = null;
      cap.textContent = piston.dataset.done || "Recorded";
      piston.classList.add("settled");
      piston.setAttribute("aria-disabled", "true");
      PISTON_FIRES[fires] && PISTON_FIRES[fires]();
    };
    piston.addEventListener("pointerdown", start);
    piston.addEventListener("keydown", start);
    ["pointerup","pointerleave","pointercancel","keyup","blur"].forEach(ev =>
      piston.addEventListener(ev, stop));
  });


  /* AS-09 — gallery. Arrow keys, Home/End, and a rail button per frame. */
  const track = document.getElementById("galTrack");
  if (track){
    const frames = [...track.querySelectorAll(".gal-frame")];
    const rail = [...stage.querySelectorAll("[data-gj]")];
    const pos = document.getElementById("galPos");
    let gi = 0;
    const show = (n) => {
      gi = Math.max(0, Math.min(frames.length - 1, n));
      const f = frames[gi];
      const shift = f.offsetLeft - (track.parentElement.clientWidth - f.offsetWidth) / 2;
      track.style.transform = `translateX(${-shift}px)`;
      frames.forEach((x,i) => {
        x.classList.toggle("is-on", i === gi);
        x.setAttribute("aria-hidden", i !== gi);
      });
      rail.forEach((b,i) => b.setAttribute("aria-current", i === gi));
      pos.textContent = `Frame ${gi+1} of ${frames.length} · ${VIEWS[gi].t}`;
    };
    rail.forEach((b,i) => b.addEventListener("click", () => show(i)));
    stage.addEventListener("keydown", e => {
      if (!e.target.closest(".gal-rail")) return;
      const k = { ArrowRight:gi+1, ArrowLeft:gi-1, Home:0, End:frames.length-1 }[e.key];
      if (k === undefined) return;
      e.preventDefault(); show(k); rail[gi].focus();
    });
    requestAnimationFrame(() => show(0));
    addEventListener("resize", () => show(gi), { passive:true });
  }

  /* AS-12 — pins and rows are two routes to the same selection. */
  const rows = [...stage.querySelectorAll("[data-poirow]")];
  const pins = [...stage.querySelectorAll("[data-poi]")];
  if (rows.length){
    const pick = (i) => {
      rows.forEach((r,n) => r.setAttribute("aria-current", n === i));
      pins.forEach((p,n) => p.classList.toggle("sel", n === i));
      rows[i].scrollIntoView({ block:"nearest" });
    };
    rows.forEach((r,i) => r.addEventListener("click", () => pick(i)));
    pins.forEach((p,i) => p.addEventListener("click", () => { pick(i); rows[i].focus(); }));
  }


  /* AS-13 — docket folder tabs, with arrow-key navigation. */
  const dtabs = [...stage.querySelectorAll('.folder [role="tab"]')];
  if (dtabs.length){
    const pick = (t) => dtabs.forEach(x => {
      const on = x === t;
      x.setAttribute("aria-selected", on);
      x.tabIndex = on ? 0 : -1;
      document.getElementById(x.getAttribute("aria-controls")).hidden = !on;
    });
    dtabs.forEach((t,i) => {
      t.addEventListener("click", () => pick(t));
      t.addEventListener("keydown", e => {
        const d = { ArrowRight:1, ArrowLeft:-1 }[e.key];
        if (!d) return;
        e.preventDefault();
        const n = dtabs[(i + d + dtabs.length) % dtabs.length];
        pick(n); n.focus();
      });
    });
  }


  /* AS-14 — the gate opens on reaching the end by ANY route. */
  const ackBox = document.getElementById("ackBox");
  if (ackBox){
    const goBtn = document.getElementById("ackGo"), why = document.getElementById("ackWhy");
    const end = document.getElementById("riskEnd");
    let reached = false;
    const openGate = () => {
      if (reached) return;
      reached = true;
      ackBox.disabled = false;
      why.textContent = "You have reached the end. Acknowledge to continue.";
      why.style.color = "var(--steel)";
    };
    /* Scroll is ONE route to the end, not the definition of having read it. */
    new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && openGate()),
      { threshold: 0 }).observe(end);
    /* Tabbing to the end counts. So does the skip control. */
    end.addEventListener("focus", openGate);
    stage.querySelector("[data-skipend]").addEventListener("click", () => {
      end.scrollIntoView({ behavior:"smooth", block:"center" });
      openGate(); ackBox.focus();
    });
    ackBox.addEventListener("change", () => {
      goBtn.disabled = !ackBox.checked;
      why.textContent = ackBox.checked
        ? `Acknowledgement of v${DISCLOSURE.version} will be recorded with your identity and the time.`
        : "Acknowledge to continue.";
    });
    goBtn.addEventListener("click", () => {
      signal(`Risk disclosure v${DISCLOSURE.version} acknowledged`, "ok");
      go("AS-06");
    });
  }

  /* AS-27 — cast is a two-step, and the confirmation never echoes the choice. */
  const castBtn = document.getElementById("castBtn");
  if (castBtn){
    const radios = [...stage.querySelectorAll('input[name="ballot"]')];
    radios.forEach((r) => r.addEventListener("change", () => { castBtn.disabled = false; }));
    let armed = false;
    castBtn.addEventListener("click", () => {
      const chosen = radios.find((r) => r.checked);
      if (!chosen) return;
      /* Two-step, INLINE. A native confirm() is a blocking modal the
         viewer did not open — the same pattern AS-16 corrects in the 404,
         and it would be worse here because the dialog would name the
         resolution in a string the browser may log. */
      if (!armed){
        armed = true;
        castBtn.textContent = "Confirm — this cannot be changed";
        castBtn.style.borderColor = "var(--hazard)";
        document.getElementById("castHelp").textContent =
          `This carries ${(RESOLUTION.myWeight/100).toFixed(2)}% of total contribution against ` +
          `${RESOLUTION.ref} and cannot be changed once the window closes. Press again to cast.`;
        return;
      }
      radios.forEach((r) => { r.disabled = true; });
      castBtn.disabled = true;
      castBtn.textContent = "Vote recorded";
      castBtn.style.borderColor = "";
      document.getElementById("castHelp").textContent =
        "Recorded. What you cast is not shown here or anywhere else.";
      document.getElementById("ballotDone").hidden = false;
      /* Says a vote was recorded. Never which. */
      signal("Vote recorded", "ok");
    });
  }

  /* AS-19 — stage sequence, invariant gating. */
  stage.querySelectorAll("[data-lock]").forEach((b) => {
    b.addEventListener("click", () => lockStage(+b.dataset.lock));
  });
  const invs = [...stage.querySelectorAll("[data-inv]")];
  if (invs.length){
    const lt = document.getElementById("lockTerms");
    invs.forEach((i) => i.addEventListener("change", () => {
      lt.disabled = !invs.every((x) => x.checked);
    }));
  }


  /* AS-17 — accordions with real state, and a filter that announces. */
  const kbq = document.getElementById("kbq");
  if (kbq){
    stage.querySelectorAll("[data-kbq] > button").forEach((b) => {
      b.addEventListener("click", () => {
        const open = b.getAttribute("aria-expanded") === "true";
        b.setAttribute("aria-expanded", String(!open));
        document.getElementById(b.getAttribute("aria-controls")).hidden = open;
        b.querySelector(".ic").textContent = open ? "+" : "\u2013";
      });
    });
    const items = [...stage.querySelectorAll("[data-kbq]")];
    const cats = [...stage.querySelectorAll("[data-kbcat]")];
    const count = document.getElementById("kbCount"), none = document.getElementById("kbNone");
    kbq.addEventListener("input", () => {
      const q = kbq.value.trim().toLowerCase();
      let n = 0;
      items.forEach((it) => {
        const hit = !q || it.textContent.toLowerCase().includes(q);
        it.hidden = !hit; if (hit) n++;
      });
      cats.forEach((c) => {
        c.hidden = ![...c.querySelectorAll("[data-kbq]")].some((x) => !x.hidden);
      });
      none.hidden = n > 0;
      /* Announced. A list that silently empties reads as a broken page. */
      count.textContent = q ? `${n} of ${items.length} answers match “${kbq.value.trim()}”`
                            : `${items.length} answers`;
    });
  }


  /* AS-18 — the apply control fills the role field rather than opening a
     panel that traps focus. */
  stage.querySelectorAll("[data-apply]").forEach((b) => {
    b.addEventListener("click", () => {
      const f = document.getElementById("applyRole");
      f.value = b.dataset.apply;
      document.querySelector(".apply").scrollIntoView({ behavior:"smooth", block:"center" });
      document.getElementById("cv").focus();
    });
  });

  /* AS-08 — the player. Advances on intent; auto-advance is a courtesy
     with a real pause, and it is off entirely under reduced motion. */
  const player = document.getElementById("player");
  if (player){
    const cards = [...player.querySelectorAll("[data-plcard]")];
    const bars  = [...player.querySelectorAll("[data-plbar]")];
    const pos   = document.getElementById("plPos");
    const pauseBtn = document.getElementById("plPause");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let i = 0, timer = null, paused = reduce, opener = null;

    const draw = () => {
      cards.forEach((c,n) => c.classList.toggle("on", n === i));
      bars.forEach((b,n) => { b.style.width = n < i ? "100%" : n === i ? "100%" : "0%";
                              b.style.transition = "none"; });
      pos.textContent = `Frame ${i+1} of ${cards.length} · ${STORY[i].t}` +
        (paused ? " · paused" : "");
    };
    const tick = () => {
      clearTimeout(timer);
      if (paused) return;
      timer = setTimeout(() => { if (i < cards.length - 1){ i++; draw(); tick(); } else { close(); } }, 5200);
    };
    const goTo = (n) => { i = Math.max(0, Math.min(cards.length - 1, n)); draw(); tick(); };
    const open = (n, from) => {
      opener = from || null;
      player.classList.add("on");
      document.body.style.overflow = "hidden";
      i = n; paused = reduce;
      pauseBtn.textContent = paused ? "Play" : "Pause";
      pauseBtn.setAttribute("aria-pressed", String(paused));
      draw(); tick();
      document.getElementById("plExit").focus();
    };
    const close = () => {
      clearTimeout(timer);
      player.classList.remove("on");
      document.body.style.overflow = "";
      if (opener) opener.focus();
    };

    stage.querySelectorAll("[data-story]").forEach((t) =>
      t.addEventListener("click", () => open(+t.dataset.story, t)));
    document.getElementById("plNext").addEventListener("click", () => goTo(i + 1));
    document.getElementById("plPrev").addEventListener("click", () => goTo(i - 1));
    document.getElementById("plExit").addEventListener("click", close);
    pauseBtn.addEventListener("click", () => {
      paused = !paused;
      pauseBtn.textContent = paused ? "Play" : "Pause";
      pauseBtn.setAttribute("aria-pressed", String(paused));
      draw(); tick();
    });
    /* A keyboard has every control the pointer has. */
    player.addEventListener("keydown", (e) => {
      if (e.key === "Escape"){ e.preventDefault(); close(); }
      if (e.key === "ArrowRight"){ e.preventDefault(); goTo(i + 1); }
      if (e.key === "ArrowLeft"){ e.preventDefault(); goTo(i - 1); }
    });
  }

  /* Aperture ring grows over an aperture. */
  stage.querySelectorAll("[data-ap], .ap-console, .btn, .piston").forEach(el => {
    el.addEventListener("mouseenter", ()=> document.body.classList.add("over-aperture"));
    el.addEventListener("mouseleave", ()=> document.body.classList.remove("over-aperture"));
  });
}

/* ── The ring, on fine pointers only ─────────────────────────────── */
if (matchMedia("(pointer: fine)").matches &&
    !matchMedia("(prefers-reduced-motion: reduce)").matches){
  const ring = document.getElementById("ring");
  document.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse") return;
    document.body.classList.add("ring-on");
    ring.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%,-50%)`;
  }, { passive:true });
}

mount("AS-01");
signal("Aperture system online");
</script>
</body>
</html>
