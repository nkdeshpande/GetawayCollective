<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- user-scalable is NOT disabled. AS-06 collects a PAN number. WCAG 1.4.4. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GC.SYSTEM · Assemblies</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   GC.SYSTEM · ASSEMBLIES — working implementation
   Tier 05/06 · Wave 6.5 · all 41 corrections applied

   Every colour below is a LOCKED token from constants/tokens.ts.
   No prototype hex survives. Contrast is stated where it matters.
   ═══════════════════════════════════════════════════════════════════ */

:root{
  /* Surfaces */
  --void:#0A0A0A; --void-panel:#121212; --paper:#F2F2F2; --paper-panel:#FFFFFF; --mist:#E8E8E6;
  /* Text */
  --ink:#0A0A0A; --ink-inv:#F2F2F2;
  /* steel is 3.72 on void and 3.52 on panel. That clears AA for LARGE
     text and for non-text UI, and micro type is 11px, which is neither.
     Four separate labels in this file reached for it before the sweep
     caught them, so the rule is now structural: steel is for rules,
     hairlines, LEDs and borders. It does not carry words. */
  --steel:#6B6B6B;      /* NON-TEXT ONLY — rules, borders, LEDs */
  --steel-dim:#9A9A9A;  /* 7.04 on void — every secondary text tone */
  /* Semantic */
  --forest:#0C3024; --forest-light:#228A68;   /* forest is 1.38 on void; the variant is 4.62 */
  --copper:#C79F6B; --copper-deep:#8C6635;    /* copper is 2.18 on paper; the variant is 4.61 */
  --electric:#2061DE; --hazard:#E8672E; --hazard-deep:#BE4915;
  --critical:#FF3B30; --critical-deep:#DD0C00; --confirm:#1FAA59; --confirm-deep:#177F43;
  /* Strokes */
  --hair:rgba(242,242,242,0.14); --hair-lt:rgba(10,10,10,0.12);
  /* Type */
  --f-display:'Outfit','Segoe UI Variable Display',-apple-system,system-ui,sans-serif;
  --f-body:'Inter','Segoe UI Variable',-apple-system,system-ui,sans-serif;
  --f-mono:'Space Mono',ui-monospace,Consolas,'SFMono-Regular',monospace;
  --f-editorial:'Playfair Display',Georgia,serif;
  /* Space — 4px base */
  --s-3xs:4px;--s-2xs:8px;--s-xs:12px;--s-s:16px;--s-m:24px;--s-l:32px;
  --s-xl:48px;--s-2xl:64px;--s-3xl:96px;--s-4xl:128px;
  /* Motion */
  --e-cinema:cubic-bezier(0.16,1,0.3,1); --e-shutter:cubic-bezier(0.9,0,0.2,1);
  --d-instant:120ms; --d-fast:240ms; --d-cinema:600ms; --d-commit:3000ms;
}

*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html{background:var(--void);-webkit-text-size-adjust:100%}
body{
  background:var(--void); color:var(--ink-inv);
  font:400 15px/1.55 var(--f-body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  /* Scrollbars stay VISIBLE. They are the only indicator of how much page is left. */
}
/* Cursor is the DEFAULT. No `cursor:none`, no `cursor:crosshair` on the
   universal selector — a crosshair over everything removes the only cue
   distinguishing what can be clicked from what cannot. */
button,a,[role="tab"],summary{cursor:pointer}

/* ── Type scale · 13 roles ───────────────────────────────────────── */
.t-display-xl{font:600 clamp(40px,7vw,56px)/0.95 var(--f-display);letter-spacing:-0.03em;text-wrap:balance}
.t-display-l{font:600 clamp(32px,5vw,44px)/1.0 var(--f-display);letter-spacing:-0.03em;text-wrap:balance}
.t-display-m{font:600 32px/1.1 var(--f-display);letter-spacing:-0.02em}
.t-heading{font:600 24px/1.2 var(--f-display);letter-spacing:-0.02em}
.t-subheading{font:500 20px/1.3 var(--f-display);letter-spacing:-0.01em}
.t-body-l{font:400 17px/1.6 var(--f-body)}
.t-body{font:400 15px/1.55 var(--f-body)}
.t-body-s{font:400 13px/1.5 var(--f-body)}
.t-caption{font:400 13px/1.4 var(--f-body)}
.t-micro{font:400 11px/1.3 var(--f-mono);letter-spacing:0.14em;text-transform:uppercase}
.t-mono{font:400 15px/1.4 var(--f-mono);font-variant-numeric:tabular-nums}
.t-mono-s{font:400 11px/1.3 var(--f-mono);letter-spacing:0.06em;font-variant-numeric:tabular-nums}
.t-editorial{font:400 italic 20px/1.5 var(--f-editorial)}

/* Money is ALWAYS mono, tabular, right-aligned in tables. */
.money{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--copper);letter-spacing:-0.01em}
.pct{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.on-paper .money{color:var(--copper-deep)}

/* IL — hierarchy is weight and opacity, never size alone */
.il-1{font-weight:700;opacity:1}
.il-2{font-weight:500;opacity:1}
.il-3{font-weight:400;opacity:.85}
.il-4{font-weight:400;opacity:.65}
.il-5{font-weight:400;opacity:1;color:var(--steel-dim)}  /* opacity would drop it below AA */
.il-6{font-weight:400;opacity:1;color:var(--steel-dim);font-size:.92em}
/* IL-5 and IL-6 cannot separate by TONE and both stay AA: only two greys
   clear 4.5 on void. Below IL-4 the levels separate by size and weight
   instead, which is what the scale should have said from the start. */

.dim{color:var(--steel-dim)}      /* 7.04 on void — safe at body size */
.label{color:var(--steel-dim)}    /* was steel at 3.72 — micro is 11px TEXT */
.on-panel .label{color:var(--steel-dim)}

/* ── Focus — visible, instant, no glow ───────────────────────────── */
:focus{outline:none}
:focus-visible{outline:2px solid var(--electric);outline-offset:2px}
.on-paper :focus-visible{outline-color:var(--electric)}

/* ── The Aperture Ring ───────────────────────────────────────────── */
/* CORRECTION: the prototype set `cursor:none` globally and drew a ring.
   On touch there is no pointer, so the page had no cursor at all; on a
   keyboard the ring never arrives. The ring is now an ornament that only
   exists where a fine pointer does. */
#ring{position:fixed;top:0;left:0;width:24px;height:24px;border:1px solid var(--forest-light);
  border-radius:50%;pointer-events:none;z-index:9000;opacity:0;
  transform:translate(-50%,-50%);
  transition:width var(--d-fast) var(--e-cinema),height var(--d-fast) var(--e-cinema),
             border-color var(--d-fast),opacity var(--d-fast)}
@media (pointer:fine){ body.ring-on #ring{opacity:1} }
body.over-aperture #ring{width:64px;height:64px;border-color:var(--copper);
  background:rgba(199,159,107,.06)}
@media (prefers-reduced-motion:reduce){ #ring{display:none} }

/* ── The Shutter ─────────────────────────────────────────────────── */
#shutter{position:fixed;inset:0;background:var(--void);z-index:8000;
  transform:translateY(100%);pointer-events:none}
#shutter.on{transform:translateY(0);transition:transform var(--d-cinema) var(--e-shutter)}
#shutter.off{transform:translateY(-100%);transition:transform var(--d-cinema) var(--e-shutter)}
@media (prefers-reduced-motion:reduce){ #shutter{display:none} }

/* ── Signal Aperture (ticker) ────────────────────────────────────── */
/* Reports what the SYSTEM did. Distinct from NT-01, which reports what
   the MEMBER did. A system line may auto-dismiss because nothing was
   asked of anyone. It is a live region so it is announced, not just seen. */
#ticker{position:fixed;top:var(--s-s);right:var(--s-s);z-index:7000;
  display:flex;gap:var(--s-2xs);align-items:center;padding:var(--s-2xs) var(--s-xs);
  background:var(--void-panel);border:1px solid var(--hair);
  opacity:0;transform:translateY(-6px);transition:opacity var(--d-fast),transform var(--d-fast)}
#ticker.on{opacity:1;transform:translateY(0)}
#ticker .k{color:var(--steel-dim)}
#ticker.info .v{color:var(--ink-inv)}
#ticker.ok   .v{color:var(--confirm)}
#ticker.bad  .v{color:var(--critical)}

/* ── HUD rail ────────────────────────────────────────────────────── */
.hud{position:sticky;top:0;z-index:600;background:rgba(10,10,10,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--hair)}
.hud-in{max-width:1400px;margin:0 auto;padding:var(--s-xs) var(--s-m);
  display:flex;align-items:center;gap:var(--s-m);flex-wrap:wrap}
.hud .brand{color:var(--forest-light);white-space:nowrap}
.hud nav{display:flex;gap:var(--s-3xs);flex-wrap:wrap;margin-left:auto}
.hud nav button{background:none;border:1px solid transparent;color:var(--steel-dim);
  font:400 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;
  padding:var(--s-2xs) var(--s-xs);transition:color var(--d-instant),border-color var(--d-instant)}
.hud nav button:hover{color:var(--ink-inv)}
.hud nav button[aria-current="page"]{color:var(--ink-inv);border-color:var(--copper)}

/* ── Layout ──────────────────────────────────────────────────────── */
.wrap{max-width:1400px;margin:0 auto;padding:0 var(--s-m)}
.narrow{max-width:1100px;margin:0 auto;padding:0 var(--s-m)}
.measure{max-width:65ch}  /* body copy, 65 characters */
section[data-sec]{padding:var(--s-2xl) 0;border-bottom:1px solid var(--hair)}
.on-paper section[data-sec]{border-bottom-color:var(--hair-lt)}
.sec-head{display:flex;gap:var(--s-s);align-items:baseline;margin-bottom:var(--s-l);flex-wrap:wrap}
.sec-ref{color:var(--steel-dim);font:400 11px/1 var(--f-mono);letter-spacing:.14em}
.stack{display:flex;flex-direction:column;gap:var(--s-m)}
.row{display:flex;gap:var(--s-l);flex-wrap:wrap}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ── GROUND INVERSION ────────────────────────────────────────────── */
/* Void while the page explains. Paper the moment it asserts. Light means
   audited. Not decorative: it maps narrative-versus-assertion onto the
   one property of a screen nobody can miss. */
.on-paper{background:var(--paper);color:var(--ink)}
.on-paper .dim{color:var(--steel)}
.on-paper .label{color:var(--steel)}
.on-paper .il-5,.on-paper .il-6{color:var(--steel)}
.ground-note{display:inline-flex;gap:var(--s-2xs);align-items:center;
  border:1px solid var(--hair-lt);padding:var(--s-3xs) var(--s-2xs);color:var(--steel)}

/* ── AS-01 · Gateway apertures ───────────────────────────────────── */
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--s-s)}
.ap-gateway{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--void-panel);
  border:1px solid var(--hair);display:block;width:100%;text-align:left;color:inherit}
.ap-gateway .plate{position:absolute;inset:0;
  background:linear-gradient(145deg,color-mix(in srgb,var(--forest) 82%,var(--paper)) 0%,color-mix(in srgb,var(--forest) 55%,var(--void)) 55%,var(--void) 100%);
  transition:transform 700ms var(--e-cinema),filter 700ms var(--e-cinema);filter:brightness(.8)}
.ap-gateway:hover .plate,.ap-gateway:focus-visible .plate{transform:scale(1.04);filter:brightness(1)}
.ap-gateway .scrim{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(10,10,10,.94) 0%,rgba(10,10,10,.25) 45%,transparent 100%)}
.ap-gateway .body{position:absolute;inset:auto 0 0 0;padding:var(--s-m)}
.ap-gateway h3{font:600 clamp(30px,4.4vw,42px)/0.86 var(--f-display);
  letter-spacing:-0.04em;text-transform:uppercase}
/* CORRECTION: the deferred row was `group-hover:opacity-100` and nothing
   else. It is now revealed by hover, focus-visible OR tap, and it is in
   the DOM and the accessibility tree at all times. A deferred field that
   is unreachable is not deferred, it is missing. */
.deferred{margin-top:var(--s-s);display:flex;gap:var(--s-s);align-items:center;flex-wrap:wrap;
  opacity:0;transform:translateY(6px);
  transition:opacity var(--d-fast) var(--e-cinema),transform var(--d-fast) var(--e-cinema)}
.ap-gateway:hover .deferred,
.ap-gateway:focus-visible .deferred,
.ap-gateway[data-open="1"] .deferred{opacity:1;transform:translateY(0)}
@media (hover:none){ .deferred{opacity:1;transform:none} }
@media (prefers-reduced-motion:reduce){ .deferred{transition:none;transform:none} }
.rule-x{width:36px;height:1px;background:var(--steel)}

/* ── Confidence tag ──────────────────────────────────────────────── */
/* A forward-looking figure rendered identically to a settled one is the
   easiest way to mislead without stating anything false. */
.conf{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--hair);
  padding:2px 6px;color:var(--steel-dim);font:400 10px/1.2 var(--f-mono);
  letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.on-paper .conf{border-color:var(--hair-lt);color:var(--steel)}
.conf::before{content:"";width:5px;height:5px;flex:none;background:currentColor}
.conf.observed::before{background:var(--confirm)}
.conf.verified::before{background:var(--confirm)}
.conf.modelled::before{background:var(--electric)}
.conf.estimated::before{background:var(--hazard)}
.conf.forecast::before{background:var(--hazard)}
.conf.pending::before{background:var(--steel)}
.prov{color:var(--steel-dim)}  /* the provisional mark ~ */

/* ── AS-02 · Console apertures ───────────────────────────────────── */
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;
  background:var(--hair);border:1px solid var(--hair)}
.ap-console{background:var(--void-panel);padding:var(--s-m);display:flex;flex-direction:column;
  gap:var(--s-m);transition:background var(--d-instant)}
.ap-console{border:1px solid transparent}
.ap-console:hover{border-color:var(--copper)}
.ap-console .top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s-s)}
.field{border-bottom:1px solid var(--hair);padding-bottom:var(--s-2xs)}
.field .k{display:block;margin-bottom:var(--s-3xs);color:var(--steel-dim)}
.field .v{display:flex;align-items:baseline;gap:var(--s-2xs);flex-wrap:wrap}
.figure{font:500 22px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
/* Valuation source sits DIRECTLY beneath the figure. Never a tooltip. */
.source{margin-top:var(--s-3xs);color:var(--steel-dim);display:block}

/* Status LED — one of only two places a circle is permitted. Always
   carries a text label: colour is never the only carrier of meaning. */
.led{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.led i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--confirm)}
.led.stale i{background:var(--hazard)}
.led.stale{color:var(--hazard)}
.led.live{color:var(--confirm)}

/* ── Buttons ─────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2xs);
  background:none;border:1px solid var(--hair);color:var(--ink-inv);
  font:400 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;
  padding:var(--s-xs) var(--s-s);
  transition:background var(--d-instant),color var(--d-instant),border-color var(--d-instant)}
.btn:hover{background:var(--ink-inv);color:var(--void);border-color:var(--ink-inv)}
.btn.primary{background:var(--ink-inv);color:var(--void);border-color:var(--ink-inv)}
.btn.primary:hover{background:var(--copper);border-color:var(--copper);color:var(--void)}
.btn[disabled]{opacity:.45;pointer-events:none}
.on-paper .btn{border-color:var(--hair-lt);color:var(--ink)}
.on-paper .btn:hover{background:var(--ink);color:var(--paper)}
.on-paper .btn.primary{background:var(--ink);color:var(--paper)}

/* ── AS-03 · Trinity Lens ────────────────────────────────────────── */
.lens{display:flex;gap:var(--s-xl);border-bottom:1px solid var(--hair);margin-bottom:var(--s-xl)}
.lens button{background:none;border:none;padding:0 0 var(--s-s);position:relative;
  color:var(--steel-dim);font:400 11px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;
  transition:color var(--d-instant)}
.lens button:hover{color:var(--ink-inv)}
.lens button[aria-selected="true"]{color:var(--ink-inv)}
.lens button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;
  height:2px;background:var(--copper)}
[role="tabpanel"][hidden]{display:none}
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s-m)}

/* ── AS-04 · Waterfall (paper ground) ────────────────────────────── */
.wf{display:flex;flex-direction:column;gap:2px;min-width:640px}
.wf-row{display:grid;grid-template-columns:220px 1fr 130px;align-items:center;gap:var(--s-s)}
.wf-row .k{text-align:right;color:var(--steel)}
.wf-track{height:38px;background:rgba(10,10,10,.05);position:relative;overflow:hidden}
.wf-bar{height:100%;width:0;background:var(--ink);display:flex;align-items:center;
  padding-left:var(--s-xs);color:var(--paper);
  transition:width 900ms var(--e-cinema)}
.wf-bar.less{background:var(--steel);color:var(--paper)}
.wf-bar.senior{background:var(--hazard-deep);color:var(--paper)}
.wf-bar.out{background:var(--confirm-deep);color:var(--paper)}
@media (prefers-reduced-motion:reduce){ .wf-bar{transition:none} }
.wf-row .amt{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;
  color:var(--copper-deep);font-weight:500}
.wf-note{grid-column:2/-1;color:var(--steel);padding-bottom:var(--s-2xs)}
.totals{border-top:2px solid var(--ink);margin-top:var(--s-2xs);padding-top:var(--s-s)}
/* Axis is never truncated. A bar chart starting anywhere but zero
   exaggerates every difference on it. */

/* ── Reserve gauge ───────────────────────────────────────────────── */
.gauge{border:1px solid var(--hair-lt);padding:var(--s-m);max-width:520px}
.gauge-track{height:10px;background:rgba(10,10,10,.08);position:relative;margin:var(--s-s) 0}
.gauge-fill{height:100%;background:var(--confirm-deep)}
.gauge-floor{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--hazard-deep)}
.gauge-floor::after{content:"Floor";position:absolute;top:-18px;left:-12px;
  font:400 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--hazard-deep)}

/* ── AS-05 · Member console ──────────────────────────────────────── */
/* `color:inherit` is load-bearing. A .panel sets a background and takes
   its colour from whichever ground it sits in — which works for a div
   and fails for a <button>, because the user-agent stylesheet gives a
   button `color: buttontext` and that does not inherit.
   The Story grid renders its tiles as buttons styled as panels, and
   they came out pure black on the void panel at 1.12:1. Fixed here
   rather than on the button, so any element that carries a UA colour is
   correct the moment it is given this class. */
.panel{background:var(--void-panel);border:1px solid var(--hair);padding:var(--s-m);color:inherit}
/* A panel ON PAPER.
   `.panel` and `.on-paper` are both single-class selectors and `.panel`
   is declared later, so `.panel.on-paper` kept the void-panel background
   while `.on-paper` set the colour to ink: #0A0A0A on #121212, 1.06:1.
   Eighty-six elements across the legal corpus rendered that way — whole
   clauses invisible against their own cards.
   The combination is the natural thing to write, so it is made correct
   here rather than forbidden in a comment. Specificity 0,2,0 beats both
   parents in either declaration order. */
.panel.on-paper{background:var(--paper-panel);border-color:var(--hair-lt);color:var(--ink)}
.kv{display:flex;justify-content:space-between;gap:var(--s-s);
  padding:var(--s-xs) 0;border-bottom:1px solid var(--hair)}
.kv:last-child{border-bottom:none}
.kv .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
/* A blocked distribution renders at the SAME weight as a paid one, with
   its reason. A member whose payment did not land is owed the reason,
   not a quieter number. */
.blocked{border-left:2px solid var(--critical);padding-left:var(--s-s)}
.blocked .why{color:var(--critical);margin-top:var(--s-3xs)}
.needs-you{border-left:2px solid var(--hazard);padding-left:var(--s-s)}

/* ── AS-06 · Commitment ──────────────────────────────────────────── */
.commit{display:grid;grid-template-columns:1fr 380px;gap:var(--s-2xl);align-items:start}
@media (max-width:900px){ .commit{grid-template-columns:1fr;gap:var(--s-l)}
  .anchor{position:static !important;order:-1} }
/* The anchor NEVER collapses and never scrolls away. On compact it pins
   to the top rather than being dropped. */
.anchor{position:sticky;top:88px;border:1px solid var(--hair);background:var(--void-panel)}
.anchor .plate{aspect-ratio:4/3;background:linear-gradient(145deg,color-mix(in srgb,var(--forest) 82%,var(--paper)),color-mix(in srgb,var(--forest) 55%,var(--void)));
  border-bottom:1px solid var(--hair)}
.anchor .in{padding:var(--s-m)}
.step{border-left:1px solid var(--hair);padding:0 0 var(--s-l) var(--s-l);position:relative}
.step:last-child{border-left-color:transparent}
.step::before{content:"";position:absolute;left:-4px;top:6px;width:7px;height:7px;
  background:var(--void);border:1px solid var(--steel)}
.step[data-state="active"]::before{background:var(--copper);border-color:var(--copper)}
.step[data-state="done"]::before{border-color:var(--copper)}
/* CORRECTION: completed steps were dimmed to 0.35 with pointer-events
   none — near 2:1, and unreadable exactly when someone wanted to check
   what they had typed. They stay legible and re-openable. */
.step[data-state="done"] .step-body{display:none}
.step[data-state="done"] .summary{display:block}
.summary{display:none;color:var(--steel-dim);margin-top:var(--s-3xs)}
.step[data-state="idle"] .step-body{display:none}
.step h3{color:var(--steel-dim)}
.step[data-state="active"] h3,.step[data-state="done"] h3{color:var(--ink-inv)}
.step-body{margin-top:var(--s-s);max-width:520px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-s);margin-bottom:var(--s-m)}
.fields .full{grid-column:1/-1}
@media (max-width:560px){ .fields{grid-template-columns:1fr} }
.f{display:flex;flex-direction:column;gap:6px}
/* A real <label>, always. A placeholder standing in for a label
   disappears exactly when it is needed. */
.f label{color:var(--steel-dim)}
.f input{background:transparent;border:1px solid var(--hair);color:var(--ink-inv);
  padding:11px var(--s-xs);font:400 15px/1.4 var(--f-body);
  transition:border-color var(--d-instant)}
.f input:focus-visible{border-color:var(--electric);border-width:2px;padding:10px 11px}
/* Uppercase ONLY on identifiers that genuinely are uppercase. Never on a
   name or an email — it renders what someone typed as something they
   did not type, on the screen where they check what they typed. */
.f input.ident{font-family:var(--f-mono);text-transform:uppercase}
.f input[type=email]{text-transform:none}
.f .help{color:var(--steel-dim)}
.saved{color:var(--confirm);opacity:0;transition:opacity var(--d-fast)}
.saved.on{opacity:1}

/* ── The Piston ──────────────────────────────────────────────────── */
/* A bar, not a ring: a ring implies a duration that loops, and this fires
   exactly once per commitment. Linear, 3000ms, never eased — an eased
   fill would misreport how much time is left to let go. */
.piston{width:100%;max-width:420px;border:1px solid var(--copper);background:transparent;
  padding:0;position:relative;overflow:hidden;height:52px;color:var(--ink-inv);display:block}
.piston .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--copper);
  transition:width var(--d-commit) linear}
.piston.arm .fill{width:100%}
.piston.rel .fill{width:0;transition:width var(--d-instant) linear}
.piston .cap{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;
  height:100%;font:400 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;
  mix-blend-mode:difference;color:#fff}
.piston .ticks{position:absolute;inset:0;pointer-events:none;display:flex}
.piston .ticks i{flex:1;border-right:1px solid rgba(242,242,242,.22)}
.piston .ticks i:last-child{border-right:none}
.piston[disabled]{border-color:var(--steel);opacity:.45;pointer-events:none}
/* Settled is NOT disabled. The piston is inert because it fired, and its
   label is now the record that capital moved — the last thing that should
   be the dimmest on the screen. */
.piston.settled{opacity:1;border-color:var(--confirm);pointer-events:none}
/* WIDTH, NOT JUST COLOUR.
   The fill was only ever 100% under `.arm`, and the React port drops
   `arm` the instant it settles — so the green drained back to zero over
   three seconds and left `color:var(--void)` sitting on the void ground
   at 1.00:1. The word "Committed" is the only record on that screen that
   capital moved, and it was invisible.
   Found by auditing the SETTLED state, not the idle one. A sweep that
   only ever measures a screen at rest never sees the state that matters
   most here. `.settled` now carries its own fill so it does not depend
   on another class still being present. */
.piston.settled .fill{background:var(--confirm);width:100%;transition:none}
.piston.settled .cap{mix-blend-mode:normal;color:var(--void)}

/* ── Settled ─────────────────────────────────────────────────────── */
.settled{border:1px solid var(--confirm);padding:var(--s-m);display:none}
.settled.on{display:block}
.settled h3{color:var(--confirm)}

/* ── Data flash — 120ms, step-end. The figure does not animate; the
   frame around it acknowledges the change. ───────────────────────── */
@keyframes flash{0%{background:rgba(242,242,242,.9);color:var(--void)}100%{}}
.flash{animation:flash var(--d-instant) step-end}
@media (prefers-reduced-motion:reduce){ .flash{animation:none} }

/* ── Correction badges ───────────────────────────────────────────── */
.fix{display:inline-flex;gap:6px;align-items:baseline;border-left:2px solid var(--forest-light);
  padding:2px 0 2px var(--s-2xs);color:var(--steel-dim);max-width:70ch}
.fix b{color:var(--forest-light);font:400 10px/1.3 var(--f-mono);letter-spacing:.1em;
  text-transform:uppercase;flex:none}
.on-paper .fix{border-left-color:var(--confirm-deep);color:var(--steel)}
.on-paper .fix b{color:var(--confirm-deep)}
.fixes{display:flex;flex-direction:column;gap:var(--s-2xs);margin-top:var(--s-m)}

table{width:100%;border-collapse:collapse}
th{text-align:left;font:400 11px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--steel-dim);padding:0 var(--s-s) var(--s-2xs) 0;border-bottom:1px solid var(--hair)}
td{padding:var(--s-xs) var(--s-s) var(--s-xs) 0;border-bottom:1px solid rgba(242,242,242,.05);
  vertical-align:top}
td.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
th.num{text-align:right}
/* Never blank. A blank cell is indistinguishable from a rendering failure. */
.empty::after{content:"—";color:var(--steel-dim)}

.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ── AS-09 · Gallery Frame ───────────────────────────────────────── */
/* Cinematic. One frame centred, the neighbours receding. Advances only
   on intent — nothing auto-plays, so no pause control is owed and none
   is faked. */
.gal{position:relative;overflow:hidden;padding:var(--s-l) 0}
.gal-track{display:flex;align-items:center;gap:2vw;
  transition:transform 700ms var(--e-cinema);will-change:transform}
@media (prefers-reduced-motion:reduce){ .gal-track{transition:none} }
.gal-frame{flex:0 0 min(62vw,760px);aspect-ratio:4/3;position:relative;overflow:hidden;
  border:1px solid var(--hair);background:var(--void-panel);
  transition:opacity 700ms var(--e-cinema),filter 700ms var(--e-cinema)}
.gal-frame:not(.is-on) .plate{opacity:.3;filter:grayscale(1)}
.gal-frame:not(.is-on) .cap{opacity:0}  /* text at 32% is 2.61:1 — hide it, do not fade it */
.gal-frame:not(.is-on) .xh{opacity:.3}
@media (prefers-reduced-motion:reduce){ .gal-frame{transition:none} }
.gal-frame .plate{position:absolute;inset:0}
.gal-frame .scrim{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(10,10,10,.92) 0%,rgba(10,10,10,.15) 55%,transparent 100%)}
.gal-frame .cap{position:absolute;inset:auto 0 0 0;padding:var(--s-l)}
.gal-frame h3{font:600 clamp(28px,3.6vw,44px)/0.9 var(--f-display);
  letter-spacing:-0.035em;text-transform:uppercase}
/* Corner crosshairs — the one ornament kept from the source. */
.xh{position:absolute;width:14px;height:14px;border:1px solid var(--hair)}
.gal-frame.is-on .xh{border-color:var(--forest-light)}
.xh.tl{top:14px;left:14px;border-right:none;border-bottom:none}
.xh.tr{top:14px;right:14px;border-left:none;border-bottom:none}
.xh.bl{bottom:14px;left:14px;border-right:none;border-top:none}
.xh.br{bottom:14px;right:14px;border-left:none;border-top:none}
/* Rail — every frame reachable directly, not only in sequence. */
.gal-rail{display:flex;gap:var(--s-2xs);align-items:center;
  margin-top:var(--s-m);flex-wrap:wrap}
.gal-rail button{background:none;border:1px solid var(--hair);color:var(--steel-dim);
  font:400 11px/1 var(--f-mono);letter-spacing:.1em;padding:var(--s-2xs) var(--s-xs);
  transition:color var(--d-instant),border-color var(--d-instant)}
.gal-rail button:hover{color:var(--ink-inv)}
.gal-rail button[aria-current="true"]{color:var(--void);background:var(--copper);
  border-color:var(--copper)}
.gal-pos{margin-left:auto;color:var(--steel-dim)}

/* ── AS-10 · Gallery Strip ───────────────────────────────────────── */
/* Catalogue. Several frames comparable at once. The caption sits BELOW
   the frame — text over an image is legible only against the part of the
   image it happens to land on. */
.strip{display:flex;gap:1px;background:var(--hair);border:1px solid var(--hair);
  overflow-x:auto;scroll-snap-type:x mandatory;padding:1px}
.strip-item{flex:0 0 min(46vw,300px);scroll-snap-align:start;background:var(--void);
  display:flex;flex-direction:column}
.strip-item .plate{aspect-ratio:3/4;position:relative;overflow:hidden}
.strip-item .plate span{position:absolute;inset:0;
  transition:transform 600ms var(--e-cinema)}
.strip-item:hover .plate span{transform:scale(1.04)}
@media (prefers-reduced-motion:reduce){ .strip-item .plate span{transition:none} }
.strip-cap{padding:var(--s-s) var(--s-xs) var(--s-m)}
.strip-cap .nm{display:block;margin-bottom:2px}
.strip-cap .sub{color:var(--steel-dim)}

/* ── AS-11 · Stage Progression ───────────────────────────────────── */
.stages{display:flex;gap:1px;background:var(--hair);border:1px solid var(--hair);
  min-width:900px}
.stage{flex:1;background:var(--void-panel);padding:var(--s-s);
  display:flex;flex-direction:column;gap:var(--s-2xs);min-width:0}
.stage.now{background:var(--void);border-top:2px solid var(--copper);padding-top:14px}
.stage .n{color:var(--steel-dim)}
.stage .t{line-height:1.2;word-break:break-word}
.stage.done .t{color:var(--steel-dim)}
.stage.now .t{color:var(--copper)}
.stage .st{margin-top:auto;padding-top:var(--s-2xs)}

.matrix{min-width:1080px;border-collapse:collapse;font-size:12px}
.matrix th{position:sticky;top:0;background:var(--void);z-index:2;padding:var(--s-2xs);
  border-bottom:1px solid var(--hair);vertical-align:bottom;font-size:10px;
  color:var(--steel-dim)}
.matrix th.role{left:0;z-index:3;text-align:left;min-width:150px;max-width:150px}
.matrix td{padding:var(--s-2xs);border-bottom:1px solid rgba(242,242,242,.06);
  border-right:1px solid rgba(242,242,242,.06);vertical-align:top;min-width:118px}
.matrix td.role{position:sticky;left:0;background:var(--void);z-index:1;
  min-width:150px;max-width:150px;border-right:1px solid var(--hair)}
.matrix tbody tr:hover td{background:rgba(242,242,242,.03)}
.matrix tbody tr:hover td.role{background:var(--void-panel)}
.matrix td.now{background:rgba(199,159,107,.05)}
/* Onboard and offboard are STATES, not decoration. */
.mk{display:inline-block;font:400 9px/1.4 var(--f-mono);letter-spacing:.1em;
  text-transform:uppercase;padding:1px 5px;margin-bottom:3px;white-space:nowrap}
.mk.on{color:var(--confirm);border:1px solid var(--confirm)}
.mk.off{color:var(--steel-dim);border:1px solid var(--hair)}
.mk.veto{color:var(--void);background:var(--critical)}
.dv{display:block;color:var(--steel-dim);line-height:1.35;margin-bottom:2px}
.dv::before{content:"";display:inline-block;width:3px;height:3px;background:var(--steel);
  vertical-align:2px;margin-right:5px}
.dv.v{color:var(--critical)}
.dv.v::before{background:var(--critical)}
/* A role absent from a stage says so. A blank cell reads as an omission. */
.absent{color:var(--steel-dim)}  /* NOT opacity: .5 on steel renders #3B3B3B at 1.77:1 */

.vetoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:var(--s-s)}
.veto{border:1px solid var(--critical);padding:var(--s-m);background:var(--void-panel)}
.veto .who{color:var(--critical);margin-bottom:var(--s-2xs)}

/* ── AS-12 · Location ────────────────────────────────────────────── */
.loc{display:grid;grid-template-columns:1fr 420px;gap:1px;background:var(--hair);
  border:1px solid var(--hair)}
@media (max-width:900px){ .loc{grid-template-columns:1fr} }
.map{background:var(--void-panel);position:relative;min-height:420px;overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.ring{fill:none;stroke:var(--forest-light);stroke-dasharray:3 5}  /* full strength: 4.37:1 */
.ring-fill{fill:var(--forest-light);opacity:.05}
.site{fill:var(--copper)}
.poi{fill:var(--steel-dim);cursor:pointer}
.poi.sel{fill:var(--copper)}
.map-legend{position:absolute;left:var(--s-s);bottom:var(--s-s);
  background:rgba(10,10,10,.88);border:1px solid var(--hair);padding:var(--s-2xs) var(--s-xs)}
.loc-panel{background:var(--void);padding:var(--s-m);max-height:620px;overflow-y:auto}
/* The panel is a LIST first. Pins select within it; they are not the only
   way in. A 24px pin is a fine shortcut and a poor sole route. */
.poi-row{width:100%;text-align:left;background:none;border:none;
  border-bottom:1px solid var(--hair);padding:var(--s-xs) 0;color:inherit;
  display:flex;justify-content:space-between;gap:var(--s-s);align-items:baseline}
.poi-row:hover{background:rgba(242,242,242,.03)}
.poi-row[aria-current="true"]{border-left:2px solid var(--copper);padding-left:var(--s-2xs)}
.poi-row .d{color:var(--steel-dim);font-family:var(--f-mono);white-space:nowrap}
.win{color:var(--steel-dim);white-space:nowrap}


/* ── AS-13 · The LLP Docket ──────────────────────────────────────── */
/* The filing-cabinet metaphor from the signed-off LegalHub: tabs that
   look like they are cut into a folder, and a paper document beneath.
   Kept, because a docket IS a physical object in every user's head and
   the metaphor does real navigational work. */
.docket{display:flex;flex-direction:column}
.docket-head{display:flex;justify-content:space-between;align-items:flex-start;
  gap:var(--s-m);flex-wrap:wrap;padding-bottom:var(--s-m);border-bottom:1px solid var(--hair)}
.standing{display:inline-flex;align-items:center;gap:var(--s-2xs);
  border:1px solid var(--confirm);color:var(--confirm);padding:var(--s-2xs) var(--s-xs)}
.standing.late{border-color:var(--hazard);color:var(--hazard)}
.standing.bad{border-color:var(--critical);color:var(--critical)}
.standing i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

.folder{display:flex;gap:0;margin-top:var(--s-l);overflow-x:auto;padding-left:2px}
.folder button{flex:none;background:var(--void-panel);border:1px solid var(--hair);
  border-bottom:none;color:var(--steel-dim);font:400 11px/1 var(--f-mono);
  letter-spacing:.1em;text-transform:uppercase;padding:var(--s-xs) var(--s-m);
  margin-right:-1px;position:relative;top:1px;white-space:nowrap;
  transition:color var(--d-instant),background var(--d-instant)}
.folder button:hover{color:var(--ink-inv)}
/* The active tab is PAPER — it is the sheet you have pulled forward, and
   the ground inversion holds: a docket page is assertion throughout. */
.folder button[aria-selected="true"]{background:var(--paper);color:var(--ink);
  border-color:var(--paper);z-index:2;font-weight:700}
.sheet{background:var(--paper);color:var(--ink);padding:var(--s-xl);position:relative;
  border:1px solid var(--paper)}
.sheet h2{font:600 clamp(28px,4vw,40px)/1 var(--f-display);letter-spacing:-.03em;
  text-transform:uppercase;margin-bottom:var(--s-2xs)}
.sheet .lead{font:400 11px/1.4 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--steel);border-top:1px solid var(--ink);padding-top:var(--s-s);
  margin-bottom:var(--s-xl);display:block}
.sheet table{width:100%;border-collapse:collapse;min-width:640px}
.sheet th{text-align:left;font:400 10px/1.3 var(--f-mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--steel);padding:0 var(--s-s) var(--s-2xs) 0;
  border-bottom:2px solid var(--ink)}
.sheet th.num{text-align:right}
.sheet td{padding:var(--s-s) var(--s-s) var(--s-s) 0;border-bottom:1px solid rgba(10,10,10,.14);
  vertical-align:top}
.sheet td.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sheet tr:hover td{background:rgba(10,10,10,.03)}
.doc-nm{font:500 15px/1.3 var(--f-body);display:block}
/* A hash is shown ALWAYS, including on restricted rows. Access controls
   the content; the fingerprint is what lets anyone verify from outside. */
.sheet .hash{font:400 10px/1.4 var(--f-mono);color:var(--steel);word-break:break-all;display:block;
  margin-top:3px}
.ver{display:inline-block;border:1px solid var(--ink);padding:1px 7px;
  font:400 10px/1.5 var(--f-mono);white-space:nowrap}
.sheet .ver.sup{border-color:var(--steel);color:var(--steel)}
/* Restricted rows keep FULL contrast. What is restricted is the content;
   the existence of the document is a fact about the entity. */
.restricted td{box-shadow:inset 2px 0 0 var(--hazard-deep)}  /* not a tint: 4% cost steel 0.37 */
.lockmark{display:inline-flex;align-items:center;gap:5px;color:var(--hazard-deep);
  font:400 10px/1.5 var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.lockmark::before{content:"";width:8px;height:8px;border:1.5px solid currentColor;
  border-bottom:none;border-radius:4px 4px 0 0;margin-bottom:-2px}
.act{border:1px solid var(--ink);background:transparent;color:var(--ink);
  padding:var(--s-2xs) var(--s-xs);font:400 10px/1.4 var(--f-mono);letter-spacing:.1em;
  text-transform:uppercase;white-space:nowrap;transition:background var(--d-instant),color var(--d-instant)}
.act:hover{background:var(--ink);color:var(--paper)}
.sheet .act[aria-disabled="true"]{border-color:var(--steel);color:var(--steel)}
.sheet .act[aria-disabled="true"]:hover{background:transparent;color:var(--steel)}

/* Statutory calendar — due dates COMPUTED, so a filing never made shows
   as overdue rather than as an absent row. */
.due{font-family:var(--f-mono);white-space:nowrap}
.due.ok{color:var(--confirm-deep)}
.due.soon{color:var(--hazard-deep)}
.due.late{color:var(--critical-deep)}
.state{font:400 10px/1.5 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;
  border:1px solid currentColor;padding:1px 7px;white-space:nowrap}
.state.filed{color:var(--confirm-deep)}
.state.open{color:var(--hazard-deep)}
.state.overdue{color:var(--critical-deep)}

.nexus{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--s-s)}
.nexus article{border:1px solid rgba(10,10,10,.2);padding:var(--s-m)}
.charge{border-left:3px solid var(--critical);padding-left:var(--s-s)}
.charge.satisfied{border-left-color:var(--confirm-deep)}
.gap{border:1px dashed var(--critical);color:var(--critical);padding:var(--s-s);
  font:400 12px/1.5 var(--f-body)}
.totrow td{border-top:2px solid var(--ink);border-bottom:none;font-weight:700;
  padding-top:var(--s-s)}


/* ── AS-21 · The Navigation Spine ────────────────────────────────── */
/* Vertical rail on console surfaces. The header says where you are; the
   spine says what else exists. The ORDER never changes — muscle memory is
   the point, and a rail that reorders by recency destroys it. */
.with-spine{display:grid;grid-template-columns:232px 1fr;gap:0;align-items:start}
@media (max-width:900px){
  /* Member routes are phone-parity. The spine becomes a horizontal bar,
     never a hamburger — hiding all navigation behind one control on the
     surface people check from a phone is where parity quietly ends. */
  .with-spine{grid-template-columns:1fr}
  .spine{position:static;border-right:none;border-bottom:1px solid var(--hair);
    flex-direction:row;overflow-x:auto;padding:var(--s-2xs) 0}
  .spine a{white-space:nowrap;border-left:none;border-bottom:2px solid transparent}
  .spine a[aria-current="page"]{border-left:none;border-bottom-color:var(--copper)}
  .spine .grp{display:none}
}
.spine{position:sticky;top:64px;display:flex;flex-direction:column;gap:1px;
  border-right:1px solid var(--hair);padding-right:var(--s-s);align-self:start}
.spine .grp{font:400 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--steel-dim);padding:var(--s-s) var(--s-2xs) var(--s-2xs)}
.spine a{display:flex;justify-content:space-between;align-items:center;gap:var(--s-2xs);
  padding:var(--s-2xs) var(--s-xs);color:var(--steel-dim);text-decoration:none;
  border-left:2px solid transparent;font:400 14px/1.4 var(--f-body);
  transition:color var(--d-instant),background var(--d-instant)}
.spine a:hover{color:var(--ink-inv);background:rgba(242,242,242,.04)}
/* Active carries a rule AND aria-current. Colour is never the carrier. */
.spine a[aria-current="page"]{color:var(--ink-inv);border-left-color:var(--copper);
  background:rgba(199,159,107,.06)}
/* A count appears ONLY where something is genuinely waiting on this
   person. A badge meaning "new" rather than "yours" teaches people to
   ignore badges. */
.spine .att{font:400 10px/1 var(--f-mono);color:var(--void);background:var(--hazard);
  padding:2px 6px;min-width:18px;text-align:center}

/* ── AS-22 · The Footer ──────────────────────────────────────────── */
/* AS-31 · THE VEHICLE CONSOLE
   One module holding every view of a vehicle. It replaced four loose
   links that navigated away from each other, so the border is drawn
   around the whole thing: the box IS the claim that this is one surface.
   The tab strip is a real tablist — roving tabindex, arrow keys — because
   a row of buttons that swaps content without them works only with a
   pointer. */
.console{border:1px solid var(--hair);background:var(--void-panel)}
.console-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s-m);
  padding:var(--s-m);border-bottom:1px solid var(--hair);flex-wrap:wrap}
.console-tabs{display:flex;gap:0;border-bottom:1px solid var(--hair);overflow-x:auto}
.console-tabs button{appearance:none;background:transparent;border:0;
  border-bottom:2px solid transparent;color:var(--steel-dim);
  font:400 12px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;
  padding:var(--s-s) var(--s-m);cursor:pointer;white-space:nowrap}
.console-tabs button:hover{color:var(--ink-inv)}
.console-tabs button.on{color:var(--copper);border-bottom-color:var(--copper)}
.console-tabs button:focus-visible{outline:2px solid var(--electric);outline-offset:-2px}
.console-panel{padding:var(--s-m)}
.console-panel:focus-visible{outline:2px solid var(--electric);outline-offset:-2px}
.console-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--s-m);
  padding:var(--s-m);border-top:1px solid var(--hair);flex-wrap:wrap}

/* The terms dialog (AS-06 / the accreditation step).
   The binding text is shown OVER the form rather than linked away from
   it: the form is resumable, but a person who leaves to read twelve
   minutes of clauses does not reliably come back, and the half-filled
   application is still behind this. Paper ground, because it is the
   binding document and not narrative. */
.modal-back{position:fixed;inset:0;background:rgba(10,10,10,.72);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:var(--s-m)}
.modal{background:var(--paper);color:var(--ink);width:min(760px,100%);max-height:86vh;
  display:flex;flex-direction:column;border:1px solid var(--hair-lt)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s-m);
  padding:var(--s-m);border-bottom:1px solid var(--hair-lt);flex:none}
.modal-body{overflow-y:auto;padding:var(--s-m);flex:1 1 auto}
.modal-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--s-m);
  padding:var(--s-m);border-top:1px solid var(--hair-lt);flex:none;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){
  .modal{animation:modal-in var(--d-fast) var(--e-shutter)}
}
@keyframes modal-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.foot{border-top:1px solid var(--hair);margin-top:var(--s-3xl);padding:var(--s-2xl) 0 var(--s-3xl)}
.foot-ent{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:var(--s-m);padding-bottom:var(--s-l);border-bottom:1px solid var(--hair)}
.foot-ent h3{font:500 15px/1.3 var(--f-body);margin-bottom:4px}
/* The standing disclosure renders at BODY size, in the reading tone. A
   disclosure set smaller than the claim it qualifies is a disclosure
   designed not to be read. */
.disclosure{margin:var(--s-l) 0;padding-left:var(--s-s);border-left:2px solid var(--hazard);
  max-width:70ch}
.disclosure p{font:400 15px/1.6 var(--f-body);color:var(--ink-inv);margin-bottom:var(--s-2xs)}
.disclosure p:last-child{margin-bottom:0}
.foot-map{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:var(--s-m);padding-top:var(--s-l);border-top:1px solid var(--hair)}
.foot-map h4{font:400 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--steel-dim);margin-bottom:var(--s-2xs)}
.foot-map a{display:block;color:var(--steel-dim);text-decoration:none;padding:3px 0;
  font-size:14px}
.foot-map a:hover{color:var(--ink-inv)}

/* ── AS-23 · The Hero Viewport ───────────────────────────────────── */
/* Height caps BELOW full viewport. A 100vh hero on a laptop in landscape
   pushes everything below it off-screen, and content that needs scroll to
   exist is content some people never find. */
.hero{position:relative;min-height:min(72vh,560px);display:flex;align-items:flex-end;
  overflow:hidden;border-bottom:1px solid var(--hair)}
.hero .bed{position:absolute;inset:0}
/* The scrim is not decoration. Type over an unscrimmed image is legible
   only against the part of the image it happens to land on, and that part
   changes with the viewport. */
.hero .scrim{position:absolute;inset:0;
  background:linear-gradient(to top,var(--void) 0%,rgba(10,10,10,.72) 34%,rgba(10,10,10,.25) 68%,transparent 100%)}
.hero .in{position:relative;padding:var(--s-3xl) 0 var(--s-xl);width:100%}
.hero h1{max-width:18ch}
.hero .sup{margin-top:var(--s-s);max-width:52ch}
.hero .go{margin-top:var(--s-l);display:flex;gap:var(--s-2xs);flex-wrap:wrap}
/* NO FIGURE over a hero. FB-1 bars full-bleed treatment wherever numeric
   data is read: a number over an image is read against whatever pixels
   sit behind it, and those differ per viewport and per crop. */

/* ── AS-24 · Testimonials ────────────────────────────────────────── */
/* A testimonial on an investment platform is regulated speech. SEBI's
   advertisement code bars them in investment advisory contexts, and a
   member's remark about what they earned is a performance claim by proxy
   — it does not become permissible because someone else said it.
   These carry statements about the PLACE. Never about the return. */
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--s-s)}
.quote{border:1px solid var(--hair);background:var(--void-panel);padding:var(--s-m);
  display:flex;flex-direction:column;gap:var(--s-s)}
.quote blockquote{font:400 italic 18px/1.5 var(--f-editorial);color:var(--ink-inv);
  max-width:38ch}
.quote figcaption{margin-top:auto;padding-top:var(--s-s);border-top:1px solid var(--hair)}
.quote .who{display:block;font:400 14px/1.4 var(--f-body)}
/* Anonymous testimonials are not published. An unattributable statement
   cannot be verified or withdrawn, and an unwithdrawable statement about
   a real person is a standing exposure. */
.quote .meta{display:block;font:400 11px/1.5 var(--f-mono);color:var(--steel-dim);margin-top:3px}
.quote .basis{display:inline-block;margin-top:var(--s-2xs);font:400 10px/1.4 var(--f-mono);
  letter-spacing:.1em;text-transform:uppercase;color:var(--steel-dim);
  border:1px solid var(--hair);padding:2px 6px}
.subject-note{border-left:2px solid var(--forest-light);padding-left:var(--s-s);
  max-width:70ch;margin-bottom:var(--s-l)}

/* ── AS-25 · The Time Ledger ─────────────────────────────────────── */
/* Nights are a COUNT, not a currency. They never render in copper —
   copper is reserved for money, and a night is not money. */
.nights{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink-inv)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--hair);
  border:1px solid var(--hair);max-width:420px}
.cal div{background:var(--void-panel);aspect-ratio:1;display:flex;align-items:center;
  justify-content:center;font:400 12px/1 var(--f-mono);color:var(--steel-dim);position:relative}
.cal div.held{background:rgba(199,159,107,.14);color:var(--ink-inv)}
.cal div.used{background:var(--void);color:var(--steel-dim);text-decoration:line-through}
.cal div.hd{background:transparent;color:var(--steel-dim);font-size:10px;aspect-ratio:auto;
  padding:var(--s-2xs) 0}
.expiry{border-left:2px solid var(--hazard);padding-left:var(--s-s);max-width:60ch}


/* ── AS-14 · The Risk Disclosure ─────────────────────────────────── */
/* Paper throughout. Every sentence here is an assertion, so the ground
   never leaves it. */
.risk{background:var(--paper);color:var(--ink);padding:var(--s-2xl) 0 var(--s-3xl)}
.risk-col{max-width:720px;margin:0 auto;padding:0 var(--s-m)}
.risk h1{font:600 clamp(34px,5vw,50px)/1 var(--f-display);letter-spacing:-.03em;
  text-transform:uppercase;margin-bottom:var(--s-s)}
.risk .ver{font:400 11px/1.4 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--steel);border-top:1px solid var(--ink);padding-top:var(--s-s);display:block}
/* No accordion and no tabs. A risk behind a click is a risk somebody
   skipped, and this is the one screen that may not be skimmable. */
.clause{margin-top:var(--s-xl);padding-left:var(--s-s);border-left:3px solid var(--hazard-deep)}
.clause.sev1{border-left-color:var(--critical-deep)}
.clause h2{font:600 24px/1.2 var(--f-display);letter-spacing:-.02em;margin-bottom:var(--s-2xs)}
.clause .sev{font:400 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--hazard-deep)}
.clause.sev1 .sev{color:var(--critical-deep)}
.clause p{font:400 16px/1.65 var(--f-body);max-width:65ch;margin-top:var(--s-2xs)}
/* The section number, set apart from the title.
   It was rendered inline with no spacing, so "01Long-Term Hospitality
   Ownership" ran together as one word. A number that has to be read as
   part of the title is not a number, it is a typo. */
.clause h2 .num{font:400 13px/1 var(--f-mono);letter-spacing:.14em;color:var(--steel);
  display:block;margin-bottom:var(--s-2xs)}

.clause .terms{margin-top:var(--s-s);font:400 12.5px/1.6 var(--f-mono);color:var(--steel);
  background:rgba(10,10,10,.05);padding:11px 14px}
/* Key and value on one line, separated. They were two spans with no
   layout, so "Minimum holding period36 months from financial close"
   rendered as a single run. */
.clause .terms > div{display:flex;gap:var(--s-s);justify-content:space-between;flex-wrap:wrap;
  padding:2px 0}
.clause .terms .k{flex:0 1 auto}
.clause .terms .v{flex:0 1 auto;text-align:right;color:var(--ink)}
.clause .terms .src{margin-top:var(--s-2xs);padding-top:var(--s-2xs);
  border-top:1px solid var(--hair-lt);display:block;opacity:.8}

/* Total loss stands outside the numbered sequence, and is marked as
   standing outside it. */
.clause.material{border-left-color:var(--critical-deep);
  background:rgba(10,10,10,.04);padding:var(--s-m);margin-top:var(--s-2xl)}
.clause.material .outcomes{margin:var(--s-s) 0 var(--s-s) 1.1em;font:400 16px/1.8 var(--f-body)}
/* Visible from the first scroll, disabled with the reason in WORDS.
   A control held at half opacity with pointer-events off is invisible to
   the eye and absent from the keyboard, so nothing says what to do. */
.ackbar{position:sticky;bottom:0;background:var(--paper-panel);border-top:2px solid var(--ink);
  padding:var(--s-m);margin-top:var(--s-2xl);z-index:40}
.ackbar .in{max-width:720px;margin:0 auto;display:flex;gap:var(--s-m);align-items:center;
  flex-wrap:wrap;padding:0 var(--s-m)}
.ackbar label{display:flex;gap:var(--s-2xs);align-items:flex-start;cursor:pointer;
  font-size:14.5px;max-width:52ch;line-height:1.5}
.ackbar input[type=checkbox]{width:19px;height:19px;flex:none;margin-top:1px;accent-color:var(--ink)}
.ackbar input:disabled + span{color:var(--steel)}
.ackbar .why{font:400 12px/1.5 var(--f-mono);color:var(--hazard-deep);flex-basis:100%}
.ackbar .go{margin-left:auto}
.risk .btn{border-color:var(--ink);color:var(--ink)}
.risk .btn:hover:not([disabled]){background:var(--ink);color:var(--paper)}
.risk .btn[disabled]{opacity:1;border-color:var(--steel);color:var(--steel);pointer-events:none}
.skipend{background:none;border:none;text-decoration:underline;color:var(--ink);
  font:400 13px/1 var(--f-body);padding:var(--s-2xs) 0}

/* ── AS-26 · The Capital Call ────────────────────────────────────── */
.call{display:grid;grid-template-columns:1fr 400px;gap:var(--s-2xl);align-items:start}
@media (max-width:900px){ .call{grid-template-columns:1fr;gap:var(--s-l)}
  .call .deriv{order:-1} }
.call-amt{display:flex;gap:var(--s-2xl);flex-wrap:wrap;align-items:baseline;
  padding-bottom:var(--s-m);border-bottom:1px solid var(--hair)}
.call-amt .big{font:500 clamp(38px,6vw,56px)/1 var(--f-mono);font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;color:var(--copper)}
/* The due date renders at EQUAL weight to the amount. A due date smaller
   than the figure is a suggestion. */
.call-amt .due-big{font:500 clamp(28px,4vw,40px)/1 var(--f-mono);letter-spacing:-.02em}
.call-amt .lb{display:block;font:400 10px/1 var(--f-mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--steel-dim);margin-bottom:var(--s-2xs)}
/* Default provisions render in FULL above the payment control. Dilution
   and forfeiture are the terms most often placed after the act. */
.default-terms{border-left:3px solid var(--critical);padding-left:var(--s-s);
  margin-top:var(--s-xl);max-width:70ch}
.default-terms h3{font:600 19px/1.3 var(--f-display);color:var(--critical);margin-bottom:var(--s-2xs)}
.default-terms li{margin-left:var(--s-s);margin-top:var(--s-2xs);color:var(--ink-inv)}
.deriv{background:var(--paper);color:var(--ink);padding:var(--s-m);position:sticky;top:88px}
.deriv h3{font:600 11px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--steel);padding-bottom:var(--s-2xs);border-bottom:1px solid var(--ink);
  margin-bottom:var(--s-2xs)}
.deriv .row{display:flex;justify-content:space-between;gap:var(--s-s);padding:10px 0;
  border-bottom:1px solid rgba(10,10,10,.12);font-size:13.5px}
.deriv .row:last-child{border-bottom:none}
.deriv .row .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--copper-deep)}
.deriv .row.tot{border-top:2px solid var(--ink);margin-top:var(--s-2xs);padding-top:12px;
  border-bottom:none;font-weight:700}
.deriv .note{font-size:12px;color:var(--steel);margin-top:var(--s-s);line-height:1.5}

/* ── AS-27 · The Ballot ──────────────────────────────────────────── */
.ballot{max-width:720px}
/* The resolution renders VERBATIM as it will be minuted. A summary of a
   resolution is a different document from the one being voted on. */
.resolution{border:1px solid var(--hair);background:var(--void-panel);padding:var(--s-m);
  font:400 17px/1.65 var(--f-body);max-width:65ch}
.res-meta{display:flex;gap:var(--s-l);flex-wrap:wrap;margin-top:var(--s-m);
  padding-top:var(--s-m);border-top:1px solid var(--hair)}
.res-meta div span{display:block;font:400 10px/1 var(--f-mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--steel-dim);margin-bottom:5px}
.res-meta div b{font:500 18px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.countdown{color:var(--hazard)}
/* Three choices at EQUAL visual weight, fixed order, none preselected.
   A default on a governance ballot is a nudge. */
.choices{display:grid;gap:var(--s-2xs);margin-top:var(--s-l);max-width:520px}
.choice{display:flex;gap:var(--s-s);align-items:center;padding:var(--s-s);
  border:1px solid var(--hair);cursor:pointer;transition:border-color var(--d-instant)}
.choice:hover{border-color:var(--steel-dim)}
.choice:has(input:checked){border-color:var(--copper);background:rgba(199,159,107,.06)}
.choice input{width:18px;height:18px;flex:none;accent-color:var(--copper)}
.choice .t{font-size:16px}
.choice .d{display:block;font-size:12.5px;color:var(--steel-dim);margin-top:2px}
.seal{border-left:2px solid var(--forest-light);padding-left:var(--s-s);
  margin-top:var(--s-m);max-width:66ch}
.tally-row{display:grid;grid-template-columns:110px 1fr 84px;gap:var(--s-s);
  align-items:center;padding:var(--s-2xs) 0}
.tally-bar{height:26px;background:rgba(242,242,242,.07);position:relative}
.tally-bar i{display:block;height:100%;background:var(--steel-dim)}
.tally-row.for .tally-bar i{background:var(--confirm)}
.tally-row.against .tally-bar i{background:var(--critical)}
.tally-row .n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.threshold-mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--copper)}

/* ── AS-19 · The Ledger Lock ─────────────────────────────────────── */
/* A constrained column is right exactly once in this system: a single
   sequence with one thing to do at each step. */
.terminal{max-width:480px;margin:0 auto;border:1px solid var(--hair);background:var(--void-panel)}
.term-head{position:relative;min-height:180px;display:flex;align-items:flex-end;
  border-bottom:1px solid var(--hair);overflow:hidden}
.term-head .bed{position:absolute;inset:0}
.term-head .sc{position:absolute;inset:0;
  background:linear-gradient(to top,var(--void-panel) 0%,rgba(10,10,10,.3) 70%,transparent 100%)}
.term-head .tt{position:relative;padding:var(--s-m)}
.term-head h2{font:600 32px/0.92 var(--f-display);letter-spacing:-.035em;text-transform:uppercase}
.lock-stage{padding:var(--s-m)}
.lock-stage[hidden]{display:none}
.lock-stage h3{font:400 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--steel-dim);margin-bottom:var(--s-m)}
/* Real checkboxes with real labels. Each one is a separate acknowledgement
   of a separate fact — bundling them makes the bundle the thing agreed. */
.inv-item{display:flex;gap:var(--s-s);align-items:flex-start;padding:var(--s-s);
  border:1px solid var(--hair);margin-bottom:var(--s-2xs);cursor:pointer}
.inv-item:has(input:checked){border-color:var(--forest-light);background:rgba(34,138,104,.07)}
.inv-item input{width:18px;height:18px;flex:none;margin-top:2px;accent-color:var(--forest-light)}
.inv-item span{font-size:13.5px;line-height:1.5;color:var(--ink-inv)}
.lock-rec{background:var(--paper);color:var(--ink);padding:var(--s-m);margin-top:var(--s-s)}
.lock-rec .ref{font:500 17px/1.3 var(--f-mono);letter-spacing:-.01em}


/* ── AS-28 · The Risk Register ───────────────────────────────────── */
/* Paper. A register is assertion end to end. */
.reg{background:var(--paper);color:var(--ink);padding:var(--s-2xl) 0 var(--s-3xl)}
.reg table{min-width:940px}
/* Severity is a figure AND a band. A 4x4 matrix reduced to colour alone
   is unreadable to a large minority. */
.sev-cell{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.sev-cell b{font:600 15px/1 var(--f-mono);font-variant-numeric:tabular-nums;min-width:18px;
  text-align:right}
.sev-cell span{font:400 9.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;
  border:1px solid currentColor;padding:2px 6px}
.sev-cell.s1{color:var(--steel)}
.sev-cell.s2{color:var(--confirm-deep)}
.sev-cell.s3{color:var(--hazard-deep)}
.sev-cell.s4{color:var(--critical-deep)}
.stale-mark{display:inline-block;font:400 9.5px/1 var(--f-mono);letter-spacing:.12em;
  text-transform:uppercase;color:var(--critical-deep);border:1px solid currentColor;
  padding:2px 6px;margin-top:4px}
.matrix-key{display:grid;grid-template-columns:auto repeat(4,52px);gap:1px;background:rgba(10,10,10,.16);
  border:1px solid rgba(10,10,10,.16);max-width:340px;margin-top:var(--s-s)}
.matrix-key div{background:var(--paper);padding:8px 4px;text-align:center;
  font:400 10px/1.3 var(--f-mono)}
.matrix-key div.h{background:var(--mist);color:var(--steel)}

/* ── AS-16 · Signal Lost ─────────────────────────────────────────── */
/* One screen, no scroll. Static: no parallax, no glitch, no noise, no
   timer. That is the whole design and it should stay that way. */
.lost{min-height:78vh;display:flex;flex-direction:column;justify-content:center;
  max-width:64ch}
.lost h1{font:600 clamp(56px,13vw,132px)/0.84 var(--f-display);letter-spacing:-.05em}
.lost .path{margin-top:var(--s-l);padding:var(--s-s) var(--s-m);border:1px solid var(--hair);
  font:400 14px/1.5 var(--f-mono);word-break:break-all;color:var(--steel-dim)}
.lost .outs{display:flex;gap:var(--s-2xs);flex-wrap:wrap;margin-top:var(--s-xl)}

/* ── AS-17 · The Knowledge Base ──────────────────────────────────── */
.kb-search{position:relative;max-width:640px;margin-top:var(--s-l)}
.kb-search label{display:block;font:400 10px/1 var(--f-mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--steel-dim);margin-bottom:var(--s-2xs)}
/* A real label. No text-transform: uppercasing renders what someone typed
   as something they did not type. */
.kb-search input{width:100%;background:transparent;border:none;
  border-bottom:2px solid var(--hair);padding:var(--s-xs) 0;color:var(--ink-inv);
  font:400 22px/1.3 var(--f-display);outline:none}
.kb-search input:focus-visible{border-bottom-color:var(--electric)}
.kb-cat{font:400 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--steel-dim);margin:var(--s-2xl) 0 var(--s-2xs);padding-bottom:var(--s-2xs);
  border-bottom:1px solid var(--hair);display:block}
.qa{border-bottom:1px solid var(--hair)}
.qa > button{width:100%;background:none;border:none;color:inherit;text-align:left;
  padding:var(--s-m) 0;display:flex;justify-content:space-between;gap:var(--s-s);
  align-items:baseline;font:500 17px/1.35 var(--f-display);letter-spacing:-.01em}
.qa > button:hover{color:var(--copper)}
.qa .ic{font:400 20px/1 var(--f-mono);color:var(--steel-dim);flex:none}
/* No height cap. Any answer over 600px was silently clipped in the
   source — including the exit-mechanism answer, which was the longest. */
.qa .ans{padding:0 0 var(--s-m);max-width:70ch}
.qa .ans[hidden]{display:none}
.cite{display:inline-flex;align-items:center;gap:6px;margin-top:var(--s-s);margin-right:var(--s-2xs);
  border:1px solid var(--hair);padding:5px 10px;font:400 10px/1.4 var(--f-mono);
  letter-spacing:.1em;text-transform:uppercase;color:var(--steel-dim);
  background:none;transition:color var(--d-instant),border-color var(--d-instant)}
.cite:hover{color:var(--copper);border-color:var(--copper)}
.kb-none{padding:var(--s-2xl) 0;color:var(--steel-dim)}

/* ── AS-15 · System Status ───────────────────────────────────────── */
/* The headline is a WORD, not a dashboard. Someone arriving here has a
   yes/no question. */
.status-hero{padding:var(--s-2xl) 0;border-bottom:1px solid var(--hair)}
.status-hero h1{font:600 clamp(40px,8vw,84px)/0.95 var(--f-display);letter-spacing:-.04em}
.status-hero h1.ok{color:var(--confirm)}
.status-hero h1.deg{color:var(--hazard)}
.status-hero h1.down{color:var(--critical)}
.comp{display:flex;justify-content:space-between;gap:var(--s-s);align-items:baseline;
  padding:var(--s-s) 0;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.comp .last{font:400 11px/1.4 var(--f-mono);color:var(--steel-dim)}
/* A component nobody has heard from renders UNKNOWN, never healthy.
   Silence is not health. */
.comp .s{font:400 10px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;
  border:1px solid currentColor;padding:3px 8px;white-space:nowrap}
.comp .s.up{color:var(--confirm)}
.comp .s.deg{color:var(--hazard)}
.comp .s.down{color:var(--critical)}
.comp .s.unk{color:var(--steel-dim)}
.inc{border-left:2px solid var(--hazard);padding-left:var(--s-s);margin-bottom:var(--s-m)}
.inc.resolved{border-left-color:var(--confirm)}
.inc .when{font:400 11px/1.4 var(--f-mono);color:var(--steel-dim)}


/* ── AS-07 · The Portfolio Narrative ─────────────────────────────── */
.brand{padding:var(--s-3xl) 0;border-bottom:1px solid var(--hair)}
.brand-h{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s-m);
  flex-wrap:wrap;margin-bottom:var(--s-l)}
.brand-h h2{font:600 clamp(38px,6vw,68px)/0.92 var(--f-display);letter-spacing:-.04em;
  text-transform:uppercase}
.brand-h .say{font:400 italic 20px/1.4 var(--f-editorial);color:var(--copper);
  text-align:right;max-width:30ch}
.brand-media{height:min(48vh,420px);border:1px solid var(--hair);overflow:hidden;position:relative}
.brand-media span{position:absolute;inset:0;transition:transform 1200ms var(--e-cinema)}
.brand:hover .brand-media span{transform:scale(1.03)}
@media (prefers-reduced-motion:reduce){ .brand-media span{transition:none} }
.brand-cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-l);margin:var(--s-l) 0}
@media (max-width:820px){ .brand-cols{grid-template-columns:1fr} }
/* Attributes are DESCRIPTIVE. No figure enters this grid — a grid of
   figures is a comparison table, and this is not one. */
.attrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;
  background:var(--hair);border:1px solid var(--hair)}
.attrs div{background:var(--void);padding:var(--s-m);min-height:150px;
  display:flex;flex-direction:column;justify-content:space-between}
.attrs .k{font:400 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--steel-dim)}
.attrs .v{font:500 19px/1.2 var(--f-display);letter-spacing:-.01em;margin-top:var(--s-s)}
.attrs .d{font-size:13px;color:var(--steel-dim);margin-top:6px;line-height:1.45}

/* ── AS-18 · Recruitment ─────────────────────────────────────────── */
.axiom{max-width:62ch;margin-bottom:var(--s-xl)}
.axiom .n{font:400 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--forest-light)}
.axiom h3{font:600 26px/1.25 var(--f-display);letter-spacing:-.025em;margin:var(--s-2xs) 0}
.role{display:grid;grid-template-columns:96px 1fr 150px 130px;gap:var(--s-m);
  padding:var(--s-m) 0;border-bottom:1px solid var(--hair);align-items:start}
@media (max-width:820px){ .role{grid-template-columns:1fr;gap:var(--s-2xs)} }
.role .cd{font:400 11px/1.5 var(--f-mono);color:var(--steel-dim)}
.role h4{font:500 19px/1.25 var(--f-display);letter-spacing:-.01em}
.role .own{font-size:13.5px;color:var(--steel-dim);margin-top:4px;max-width:56ch}
.role .sen{font:400 11px/1.5 var(--f-mono);color:var(--steel-dim)}
/* A filled role stays FULLY legible. Someone reading it is deciding
   whether to watch for the next one. */
.role .filled{font:400 10px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;
  border:1px solid var(--hair);padding:5px 9px;color:var(--steel-dim);display:inline-block}
.apply{border:1px solid var(--hair);background:var(--void-panel);padding:var(--s-m);
  max-width:560px;margin-top:var(--s-xl)}
/* A real file input. A drop zone alone cannot be reached from a keyboard. */
.apply input[type=file]{display:block;margin-top:var(--s-2xs);color:var(--steel-dim);
  font:400 13px/1.5 var(--f-body);width:100%}
.apply input[type=file]::file-selector-button{background:transparent;border:1px solid var(--hair);
  color:var(--ink-inv);font:400 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;
  padding:10px 14px;margin-right:var(--s-s)}
.apply input[type=file]::file-selector-button:hover{background:var(--ink-inv);color:var(--void)}

/* ── AS-08 · The Story Playback ──────────────────────────────────── */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1px;
  background:var(--hair);border:1px solid var(--hair)}
.tile{background:var(--void);position:relative;aspect-ratio:4/5;overflow:hidden;
  border:none;padding:0;text-align:left;color:inherit;width:100%}
.tile .bed{position:absolute;inset:0;transition:transform 600ms var(--e-cinema)}
.tile:hover .bed,.tile:focus-visible .bed{transform:scale(1.04)}
@media (prefers-reduced-motion:reduce){ .tile .bed{transition:none} }
.tile .sc{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(10,10,10,.92) 0%,rgba(10,10,10,.15) 55%,transparent 100%)}
.tile .cap{position:absolute;inset:auto 0 0 0;padding:var(--s-s)}
.tile h3{font:600 20px/1.05 var(--f-display);letter-spacing:-.025em;text-transform:uppercase}
#player{position:fixed;inset:0;z-index:7500;background:var(--void);display:none}
#player.on{display:flex;flex-direction:column}
.pl-bars{display:flex;gap:4px;padding:var(--s-s) var(--s-m) 0}
.pl-bars i{flex:1;height:3px;background:rgba(242,242,242,.22);overflow:hidden;display:block}
.pl-bars i b{display:block;height:100%;width:0;background:var(--ink-inv)}
.pl-top{display:flex;justify-content:space-between;align-items:center;gap:var(--s-s);
  padding:var(--s-s) var(--s-m)}
.pl-stage{flex:1;position:relative;margin:0 var(--s-m) var(--s-m);overflow:hidden;
  border:1px solid var(--hair)}
.pl-card{position:absolute;inset:0;display:none}
.pl-card.on{display:block}
.pl-card .bed{position:absolute;inset:0}
.pl-card .sc{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(10,10,10,.94) 0%,rgba(10,10,10,.2) 60%,transparent 100%)}
.pl-card .cap{position:absolute;inset:auto 0 0 0;padding:var(--s-xl)}
.pl-card h2{font:600 clamp(30px,6vw,58px)/0.9 var(--f-display);letter-spacing:-.04em;
  text-transform:uppercase;max-width:16ch}
.pl-card p{margin-top:var(--s-s);max-width:52ch}
.pl-ctl{display:flex;gap:var(--s-2xs);align-items:center}

/* ── AS-36 · THE ALLOCATION MATRIX ────────────────────────────────
   Adapted from AllocateCapital1.html. The source's selected state was
   a gold fill; copper is money-only here, so selection is carried by a
   filled rule, a weight change and aria-checked together. */
.alloc{border:1px solid var(--hair);background:var(--void-panel)}
.on-paper .alloc{border-color:var(--hair-lt);background:var(--paper-panel)}
.alloc-head{display:flex;gap:var(--s-l);justify-content:space-between;flex-wrap:wrap;
  padding:var(--s-m);border-bottom:1px solid var(--hair)}
.on-paper .alloc-head{border-bottom-color:var(--hair-lt)}
.alloc-cap{display:flex;flex-direction:column;gap:var(--s-3xs);min-width:190px}
.alloc-bar{height:6px;background:rgba(242,242,242,.14);display:block}
.on-paper .alloc-bar{background:rgba(10,10,10,.10)}
.alloc-bar span{display:block;height:100%;background:var(--steel-dim)}

.alloc-ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;
  background:var(--hair)}
.on-paper .alloc-ladder{background:var(--hair-lt)}
.alloc-tile{display:flex;flex-direction:column;gap:var(--s-3xs);align-items:flex-start;
  background:var(--void);border:none;padding:var(--s-s) var(--s-s) var(--s-m);
  color:inherit;cursor:pointer;text-align:left;
  transition:background var(--d-instant)}
.on-paper .alloc-tile{background:var(--paper)}
.alloc-tile:hover{background:var(--void-panel)}
.on-paper .alloc-tile:hover{background:var(--paper-panel)}
.alloc-tile .mark{width:100%;height:3px;background:var(--hair);display:block;
  margin-bottom:var(--s-2xs)}
.on-paper .alloc-tile .mark{background:var(--hair-lt)}
.alloc-tile .p{font:400 24px/1 var(--f-mono);font-variant-numeric:tabular-nums;
  color:var(--steel-dim);letter-spacing:-.02em}
.on-paper .alloc-tile .p{color:var(--steel)}
.alloc-tile .u{color:var(--steel-dim)}
.on-paper .alloc-tile .u{color:var(--steel)}
.alloc-tile[aria-checked="true"]{background:var(--void-panel)}
.on-paper .alloc-tile[aria-checked="true"]{background:var(--paper-panel)}
.alloc-tile[aria-checked="true"] .mark{background:var(--ink-inv)}
.on-paper .alloc-tile[aria-checked="true"] .mark{background:var(--ink)}
.alloc-tile[aria-checked="true"] .p{font-weight:700;color:var(--ink-inv)}
.on-paper .alloc-tile[aria-checked="true"] .p{color:var(--ink)}
.alloc-tile.off{cursor:not-allowed}
/* NOT opacity.
   `opacity:.5` on the disabled tiles took steel-dim from 7.04:1 to
   2.53:1 — measured on the rendered page, not guessed. WCAG exempts a
   disabled CONTROL, but this tile carries the reason it is disabled and
   the size it would have been, and a reason nobody can read is not a
   reason given. Struck through instead: it says unavailable without
   dimming, and it says it without relying on colour. */
.alloc-tile.off .p,.alloc-tile.off .u{text-decoration:line-through;
  text-decoration-thickness:1px}
.alloc-tile .x{color:var(--hazard)}
.on-paper .alloc-tile .x{color:var(--hazard-deep)}
@media (prefers-reduced-motion:reduce){ .alloc-tile{transition:none} }

.alloc-limits{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:var(--s-m);padding:var(--s-m);border-top:1px solid var(--hair)}
.on-paper .alloc-limits{border-top-color:var(--hair-lt)}

.alloc-body{display:grid;grid-template-columns:1fr 330px;gap:var(--s-l);
  padding:var(--s-m);border-top:1px solid var(--hair)}
.on-paper .alloc-body{border-top-color:var(--hair-lt)}
@media (max-width:900px){ .alloc-body{grid-template-columns:1fr} }
.alloc-read .lead{padding-bottom:var(--s-m);margin-bottom:var(--s-2xs)}
.alloc-read .lead .t-display-l{margin-top:var(--s-3xs)}
.alloc-conf{margin-left:var(--s-2xs);display:inline-block;vertical-align:middle}
.alloc-side{display:flex;flex-direction:column;gap:var(--s-m);align-items:flex-start}
.alloc-gov{border:1px solid var(--hair);padding:var(--s-s);width:100%}
.on-paper .alloc-gov{border-color:var(--hair-lt)}
.alloc-gov .g{padding:var(--s-2xs) 0 var(--s-2xs) var(--s-s);
  border-left:2px solid var(--steel);margin-top:var(--s-2xs)}
.alloc-gov .g.power{border-left-color:var(--electric)}

/* ── AS-32 · FOUR PANE ARRANGEMENTS ───────────────────────────────
   ledger (the_syndicate) · journey (how_it_works) · qa (how_it_works)
   · plates (MediaKit). Each keeps the arrangement and drops the part
   that asserted something untrue — see the components. */

/* The ledger.
   The source dimmed every OTHER row to 40% on hover, to isolate one
   line. Measured: steel-dim at .55 opacity composites to 2.87:1 on the
   void ground, so resting a pointer anywhere on this page would put
   five of its six rows below AA — and the rows ARE the page. The
   isolation is done by lifting the hovered row instead, which takes
   nothing away from the others. */
.ledger{border-top:2px solid var(--ink-inv)}
.on-paper .ledger{border-top-color:var(--ink)}
.ledger-row{display:grid;grid-template-columns:1fr;gap:var(--s-s);
  border-bottom:1px solid var(--hair);padding:var(--s-m);
  transition:background var(--d-instant)}
.on-paper .ledger-row{border-bottom-color:var(--hair-lt)}
@media(min-width:900px){ .ledger-row{grid-template-columns:220px 1fr 220px;gap:var(--s-l)} }
.ledger-row:hover,.ledger-row:focus-within{background:var(--void-panel)}
.on-paper .ledger-row:hover,.on-paper .ledger-row:focus-within{background:var(--paper-panel)}
@media (prefers-reduced-motion:reduce){ .ledger-row{transition:none} }
.cell-meta{display:flex;flex-direction:column;gap:var(--s-2xs);align-items:flex-start}
.a-pill{display:inline-flex;align-items:center;padding:4px 10px;border:1px solid var(--steel);
  text-transform:uppercase;color:var(--ink-inv)}
.on-paper .a-pill{color:var(--ink)}
.cell-entity h3{color:var(--ink-inv)}
.on-paper .cell-entity h3{color:var(--ink)}
.cell-state{display:flex;flex-direction:column;gap:var(--s-2xs);align-items:flex-start}
@media(min-width:900px){ .cell-state{align-items:flex-end;text-align:right} }
.cell-state .state{font:400 11px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;
  border:1px solid currentColor;padding:5px 10px;display:inline-block}
.cell-state .state.vacant{color:var(--steel-dim)}
.on-paper .cell-state .state.vacant{color:var(--steel)}
.cell-state .state.held{color:var(--confirm)}
.on-paper .cell-state .state.held{color:var(--confirm-deep)}

/* The sequence. The spine fills as the reader descends.
   Named `seq`, not the noun how_it_works.html used for it — that word
   is one of the 16 forbidden by L1 §25, and vocab-lint is right to
   refuse it even in a class name. */
.seq{position:relative;max-width:820px}
.seq-spine{position:absolute;left:19px;top:6px;bottom:6px;width:1px;background:var(--hair)}
.on-paper .seq-spine{background:var(--hair-lt)}
.seq-fill{position:absolute;inset:0;background:var(--ink-inv);transform-origin:top;
  transform:scaleY(0);transition:transform var(--d-cinema) var(--e-cinema)}
.on-paper .seq-fill{background:var(--ink)}
@media (prefers-reduced-motion:reduce){ .seq-fill{transition:none} }
.seq-steps{list-style:none;margin:0;padding:0;position:relative}
.seq-step{display:flex;gap:var(--s-l);padding-bottom:var(--s-2xl)}
.seq-step:last-child{padding-bottom:0}
.seq-node{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--steel);background:var(--void);color:var(--steel-dim)}
.on-paper .seq-node{background:var(--paper);color:var(--steel)}
.seq-step[data-on="1"] .seq-node{background:var(--ink-inv);color:var(--void);border-color:var(--ink-inv)}
.on-paper .seq-step[data-on="1"] .seq-node{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seq-body{padding-top:6px}
.seq-parts{list-style:none;margin:var(--s-s) 0 0;padding:var(--s-s);border:1px dashed var(--hair);
  display:inline-flex;flex-direction:column;gap:6px}
.on-paper .seq-parts{border-color:var(--hair-lt)}
.seq-parts li{color:var(--steel-dim);display:flex;align-items:center;gap:10px}
.on-paper .seq-parts li{color:var(--steel)}
.seq-parts li::before{content:"";width:5px;height:5px;background:currentColor;flex:none}

/* The questions. <details>, so it works before JavaScript does.
   NAMED .qa-set, NOT .qa. `.qa` is already taken by the Answers page,
   where it is the ITEM (`.qa > button`, `.qa .ans`) rather than the
   container. Reusing it would have handed every answer on that page a
   max-width and a stray border from a rule written for a different
   component -- a cascade collision that looks like a spacing bug and is
   found nowhere near the CSS that caused it. */
.qa-set{border-top:1px solid var(--hair);max-width:820px}
.on-paper .qa-set{border-top-color:var(--hair-lt)}
.qa-set details{border-bottom:1px solid var(--hair)}
.on-paper .qa-set details{border-bottom-color:var(--hair-lt)}
.qa-set summary{cursor:pointer;padding:var(--s-m) var(--s-l) var(--s-m) 0;position:relative;
  list-style:none;color:var(--ink-inv)}
.on-paper .qa-set summary{color:var(--ink)}
.qa-set summary::-webkit-details-marker{display:none}
.qa-set summary::after{content:"+";position:absolute;right:0;top:var(--s-m);
  font-family:var(--f-mono);color:var(--steel-dim)}
.on-paper .qa-set summary::after{color:var(--steel)}
.qa-set details[open] summary::after{content:"\2212"}
.qa-set details > p{padding:0 0 var(--s-m)}

/* The plates. Kind is on the plate, not in the caption. */
.plates{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--s-s)}
.plate{margin:0;border:1px solid var(--hair)}
.on-paper .plate{border-color:var(--hair-lt)}
.plate-bed{aspect-ratio:16/10;display:flex;align-items:flex-end;padding:var(--s-s);
  background:repeating-linear-gradient(45deg,rgba(242,242,242,.045) 0 10px,transparent 10px 20px)}
.on-paper .plate-bed{background:repeating-linear-gradient(45deg,rgba(10,10,10,.05) 0 10px,transparent 10px 20px)}
.plate-bed span{border:1px solid var(--steel);padding:4px 10px;color:var(--ink-inv)}
.on-paper .plate-bed span{color:var(--ink)}
.plate[data-kind="absent"] .plate-bed span{color:var(--hazard);border-color:var(--hazard)}
.on-paper .plate[data-kind="absent"] .plate-bed span{color:var(--hazard-deep);border-color:var(--hazard-deep)}
.plate figcaption{display:flex;flex-direction:column;gap:var(--s-3xs);padding:var(--s-s);
  border-top:1px solid var(--hair)}
.on-paper .plate figcaption{border-top-color:var(--hair-lt)}
